window.DEEPINSIGHT_DATA = {"generatedAt":"2026-04-24T03:10:09.290Z","title":"DeepInsight 项目运作看板","version":"v1.0","repoUrl":"https://github.com/Boris-hbx/DeepInsight","pagesUrl":"https://boris-hbx.github.io/DeepInsight/","manualHtml":"\u003ch1>DeepInsight 项目初始化草稿\u003c/h1>\n\u003cblockquote>\n\u003cp>状态：\u003cstrong>草稿 / 待评审\u003c/strong>\n作者：Boris + Claude\n最后更新：2026-04-23\n这是初始化方案的讨论稿，评审通过后才执行实施。每一轮修改都在这里留痕，方便 8 人达成共识。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2>0. 项目一页纸（Project One-Pager）\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>项目名\u003c/td>\n\u003ctd>DeepInsight\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>目标\u003c/td>\n\u003ctd>做&quot;洞察分析&quot;应用：用户以看报告为主，可上传 PDF、粘贴论文/博客链接，支持多模态输入与分析\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>形态\u003c/td>\n\u003ctd>一期：Web；二期：手机 App（后续再设计）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>团队\u003c/td>\n\u003ctd>8 人，跨领域：研发范式、软件工程、系统设计、可靠性、测试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>双重目标\u003c/td>\n\u003ctd>①交付一个真实可用的产品；②作为&quot;先进 code agent 协作&quot;的沙盒 —— 探索多人+多 agent、spec 质量、skill 生命周期、subagent、工程规范\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>仓库\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/Boris-hbx/DeepInsight%EF%BC%88%E5%B7%B2%E5%85%8B%E9%9A%86%E8%87%B3\">https://github.com/Boris-hbx/DeepInsight（已克隆至\u003c/a> \u003ccode>C:\\Project\\DeepInsight\u003c/code>，\u003cstrong>公开仓库\u003c/strong>，目前为空）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2>1. 已确认的决策\u003c/h2>\n\u003ch3>1.1 技术栈：方案 A\u003c/h3>\n\u003cp>\u003cstrong>Next.js (App Router) + TypeScript + Tailwind CSS + shadcn/ui\u003c/strong>\u003c/p>\n\u003cp>理由：\u003c/p>\n\u003cul>\n\u003cli>前后端一体，8 人心智负担最小\u003c/li>\n\u003cli>单语言（TS）降低沟通成本\u003c/li>\n\u003cli>Anthropic SDK 有 TS 官方支持，多模态调用顺\u003c/li>\n\u003cli>React 组件未来可部分迁移到 React Native / Expo，为二期 mobile 留退路\u003c/li>\n\u003c/ul>\n\u003cp>多模态相关（待在 ADR 或 spec 中细化）：\u003c/p>\n\u003cul>\n\u003cli>PDF 解析（备选：\u003ccode>pdf-parse\u003c/code> / \u003ccode>unpdf\u003c/code> / Claude Files API 直接上传）\u003c/li>\n\u003cli>URL 抓取（备选：\u003ccode>@mozilla/readability\u003c/code> + \u003ccode>jsdom\u003c/code> / 外部 scraper API）\u003c/li>\n\u003cli>LLM：Anthropic Claude（多模态 + 长上下文适合长文档 insight）\u003c/li>\n\u003c/ul>\n\u003ch3>1.2 仓库策略\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>单仓库 + \u003ccode>/web\u003c/code> 子目录\u003c/strong>，暂不引入 monorepo 工具（pnpm workspaces / Turborepo）\u003c/li>\n\u003cli>理由：8 人规模不值得；二期 mobile 出现时再升级，届时 \u003ccode>/web\u003c/code> 已是自然的子包\u003c/li>\n\u003cli>\u003ccode>main\u003c/code> 分支保护，禁止直推\u003c/li>\n\u003cli>分支命名：\u003ccode>feat/&lt;name&gt;/&lt;slug&gt;\u003c/code>、\u003ccode>fix/&lt;name&gt;/&lt;slug&gt;\u003c/code>、\u003ccode>spec/&lt;name&gt;/&lt;slug&gt;\u003c/code>\u003c/li>\n\u003cli>PR 必须关联一个 \u003ccode>docs/specs/NNN-*.md\u003c/code>\u003c/li>\n\u003cli>≥1 人 review + CI 绿灯 才能合并\u003c/li>\n\u003c/ul>\n\u003ch3>1.3 协作模式：人人端到端（everyone owns a slice）\u003c/h3>\n\u003cp>每个人独立跑通一条垂直切片的全流程：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Proposal\u003c/strong> → \u003ccode>docs/specs/NNN-*.md\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>Review\u003c/strong>：同事 comment；reliability / test 背景的人把检查项沉淀进 spec 模板\u003c/li>\n\u003cli>\u003cstrong>Build\u003c/strong>：feature 分支 + Claude / subagent 协作\u003c/li>\n\u003cli>\u003cstrong>Test\u003c/strong>：按自己 spec 的测试策略实现\u003c/li>\n\u003cli>\u003cstrong>Demo\u003c/strong>：合并后在团队 sync 演示\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>横向角色的杠杆点：\u003c/strong> reliability / test / SE 规范背景的人不做审批网关，做\u003cstrong>规范作者\u003c/strong> —— 他们的产出是：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>.claude/skills/\u003c/code> 下的 skill（可被全员自动触发）\u003c/li>\n\u003cli>\u003ccode>docs/specs/TEMPLATE.md\u003c/code> 里的检查项槽位\u003c/li>\n\u003cli>CI 中的自动化门禁\u003c/li>\n\u003c/ul>\n\u003cp>这样他们既有纵向的 slice 体验，又有横向影响力。\u003c/p>\n\u003ch3>1.4 Agent 协作元数据\u003c/h3>\n\u003cp>commit message 约定标注 agent 参与程度（方便后续复盘&quot;探索&quot;数据）：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>[human]\u003c/code> 纯人类\u003c/li>\n\u003cli>\u003ccode>[pair]\u003c/code> 人机协作\u003c/li>\n\u003cli>\u003ccode>[agent]\u003c/code> agent 主导、人类 review\u003c/li>\n\u003c/ul>\n\u003ch3>1.5 Git 身份\u003c/h3>\n\u003cul>\n\u003cli>团队每人使用自己的 GitHub 账号邮箱（Boris 的是 \u003ccode>baoxing2391@163.com\u003c/code>）\u003c/li>\n\u003cli>\u003cstrong>待确认：\u003c/strong> Boris 当前 shell 中 git global 为空，需本地配一次 \u003ccode>git config --global user.email ...\u003c/code>；或者 Claude 代为设置（方式待定）\u003c/li>\n\u003c/ul>\n\u003ch3>1.6 项目运作看板\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>目的\u003c/strong>：让 8 人随时看到项目运作状态（特性切片进度、spec/ADR 索引、agent 协作度、运作手册）\u003c/li>\n\u003cli>\u003cstrong>形态\u003c/strong>：纯 HTML/CSS/JS 静态看板（继承 \u003ccode>C:\\Project\\pm-dashboard\u003c/code> 的风格，\u003cstrong>不\u003c/strong>引入 Next.js / React）\u003c/li>\n\u003cli>\u003cstrong>数据源\u003c/strong>：markdown 驱动 —— 自动解析 \u003ccode>项目初始化草稿.md\u003c/code>、\u003ccode>docs/specs/*.md\u003c/code>、\u003ccode>docs/architecture/adr/*.md\u003c/code>；\u003ccode>git log\u003c/code> 为辅（统计 commit 的 agent trailer）\u003c/li>\n\u003cli>\u003cstrong>部署\u003c/strong>：GitHub Pages（仓库已公开），地址 \u003ccode>https://boris-hbx.github.io/DeepInsight/\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>⚠ 部署分支选择\u003c/strong>：用 \u003cstrong>\u003ccode>gh-pages\u003c/code> 分支\u003c/strong> 而不是 \u003ccode>main\u003c/code> 的 \u003ccode>/docs\u003c/code> 文件夹 —— 原因是 \u003ccode>/docs\u003c/code> 已被规划为开发文档目录（specs / ADR / guides），不能覆写。\u003ccode>npm run deploy\u003c/code> 会把构建产物推到 \u003ccode>gh-pages\u003c/code> 分支，GitHub Pages 自动发布（这是对上一轮&quot;用 docs/ 文件夹&quot;方案的修正）\u003c/li>\n\u003cli>\u003cstrong>两类内容\u003c/strong>：\u003cul>\n\u003cli>\u003cstrong>运作手册\u003c/strong>（静态）：从本草稿 md 抽取，含一页纸、决策、spec 流程、目录规范、开放问题\u003c/li>\n\u003cli>\u003cstrong>实时状态\u003c/strong>（动态）：特性切片墙、agent 协作度统计、Skill/Subagent 注册表、ADR 索引、最近 demo\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>启动策略（分两波）\u003c/strong>：\u003cul>\n\u003cli>第一波：空壳 + 运作手册渲染，让 8 人能看到&quot;规则怎么跑&quot;\u003c/li>\n\u003cli>第二波：等有真实 spec/commit 后，状态面板自动填充\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>原则\u003c/strong>：草稿 md 是\u003cstrong>唯一真源\u003c/strong>，看板是\u003cstrong>视图\u003c/strong>；改 md → \u003ccode>npm run build\u003c/code> 重渲染，一致性由工具保证\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2>2. 目录规范（待评审）\u003c/h2>\n\u003cpre>\u003ccode>DeepInsight/\n├── CLAUDE.md                   # 项目级 Claude Code 指引\n├── README.md                   # 项目简介 + 快速开始\n├── 项目初始化草稿.md            # 本文档（实施后归档或删除）\n├── 项目初始化草稿.html          # 本文档的渲染版（浏览器阅读用）\n├── package.json                # 看板构建脚本依赖（轨道 B）\n├── .gitignore\n├── docs/                       # 开发文档（仓库内阅读；不走 GitHub Pages）\n│   ├── architecture/\n│   │   └── adr/                # Architecture Decision Records（NNNN-title.md）\n│   ├── specs/                  # 特性 proposal（NNN-slug.md）\n│   │   └── TEMPLATE.md\n│   ├── guides/                 # 贡献指南、开发手册\n│   │   └── CONTRIBUTING.md\n│   └── assets/\n│       ├── screenshots/        # UI/bug 截图（YYYY-MM-DD-desc.png）\n│       └── diagrams/           # 架构图/流程图源文件\n├── dashboard/                  # 运作看板源码（与 /web 解耦）\n│   ├── index.html\n│   ├── assets/\n│   │   ├── style.css\n│   │   └── main.js\n│   └── data.json               # 构建产物（gitignore，每次 build 生成）\n├── scripts/\n│   └── build-dashboard.js      # 扫描 md + git log → data.json → dist/\n├── web/                        # Next.js 应用\n├── .claude/                    # 项目级 Claude Code 配置\n│   ├── agents/                 # 项目 subagent 定义\n│   ├── skills/                 # 项目 skill\n│   └── settings.json           # 共享的权限、hook\n└── .github/\n    ├── PULL_REQUEST_TEMPLATE.md\n    └── workflows/              # CI（后续添加）\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>命名约定：\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>spec：\u003ccode>docs/specs/NNN-short-slug.md\u003c/code>，\u003ccode>NNN\u003c/code> 单调递增（001 起）\u003c/li>\n\u003cli>ADR：\u003ccode>docs/architecture/adr/NNNN-title.md\u003c/code>（4 位，业界惯例）\u003c/li>\n\u003cli>截图：\u003ccode>docs/assets/screenshots/YYYY-MM-DD-description.png\u003c/code>\u003c/li>\n\u003cli>图表源文件：\u003ccode>docs/assets/diagrams/&lt;name&gt;.{drawio,excalidraw,puml}\u003c/code>\u003c/li>\n\u003cli>看板发布：\u003ccode>gh-pages\u003c/code> 分支（GitHub Pages 自动识别），由 \u003ccode>npm run deploy\u003c/code> 推送 —— \u003cstrong>不进 \u003ccode>main\u003c/code> 分支\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2>3. 实施步骤（两条并行轨道）\u003c/h2>\n\u003cblockquote>\n\u003cp>分两条\u003cstrong>并行\u003c/strong>推进：\u003cstrong>轨道 A\u003c/strong>（应用本体）仍是治理 → 技术栈 → 业务脚手架三层；\u003cstrong>轨道 B\u003c/strong>（运作看板）独立成线，与 A 无阻塞关系。轨道 B 先出成果，能让 8 人立刻看到&quot;运作规则&quot;。\u003c/p>\n\u003c/blockquote>\n\u003ch3>轨道 A：应用本体\u003c/h3>\n\u003ch4>A1 第一轮（治理层，本次）\u003c/h4>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>README.md\u003c/code>\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>.gitignore\u003c/code>（Node/Next.js + IDE + OS + \u003ccode>dashboard/data.json\u003c/code> + \u003ccode>dist/\u003c/code>）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>CLAUDE.md\u003c/code>\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>docs/specs/TEMPLATE.md\u003c/code>（含 reliability/test checklist 槽位）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>docs/guides/CONTRIBUTING.md\u003c/code>（分支、PR、review 流程）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>docs/architecture/adr/0000-record-architecture-decisions.md\u003c/code>（采纳 ADR）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>.github/PULL_REQUEST_TEMPLATE.md\u003c/code>\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 占位 \u003ccode>.gitkeep\u003c/code>：\u003ccode>docs/assets/screenshots/\u003c/code>、\u003ccode>docs/assets/diagrams/\u003c/code>、\u003ccode>.claude/agents/\u003c/code>、\u003ccode>.claude/skills/\u003c/code>\u003c/li>\n\u003c/ul>\n\u003ch4>A2 第二轮（技术栈）\u003c/h4>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>web/\u003c/code> 目录 Next.js 脚手架（TS + Tailwind + shadcn/ui）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 基础 \u003ccode>.eslintrc\u003c/code> / \u003ccode>prettier\u003c/code> / \u003ccode>tsconfig\u003c/code> 约定\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 首批 ADR：多模态后端选型、LLM 调用封装位置、状态管理\u003c/li>\n\u003c/ul>\n\u003ch4>A3 第三轮（业务脚手架）\u003c/h4>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 第一个垂直切片：用户上传一份 PDF → 得到洞察摘要\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>.github/workflows/ci.yml\u003c/code>：lint + typecheck + test\u003c/li>\n\u003c/ul>\n\u003ch3>轨道 B：项目运作看板\u003c/h3>\n\u003ch4>B1 第一波（空壳 + 运作手册，可立即启动）\u003c/h4>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>package.json\u003c/code>（依赖：\u003ccode>gh-pages\u003c/code>、\u003ccode>gray-matter\u003c/code>、\u003ccode>marked\u003c/code>、\u003ccode>simple-git\u003c/code>）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>dashboard/index.html\u003c/code>（布局骨架：顶栏 + 运作手册 + 切片墙占位 + 协作度占位）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>dashboard/assets/style.css\u003c/code>（暗色系 + CSS 变量，继承 pm-dashboard 风格）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>dashboard/assets/main.js\u003c/code>（读 \u003ccode>data.json\u003c/code> 渲染）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>scripts/build-dashboard.js\u003c/code>：从 \u003ccode>项目初始化草稿.md\u003c/code> 提取章节 → \u003ccode>data.json\u003c/code>\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>npm run serve\u003c/code> 本地预览；\u003ccode>npm run deploy\u003c/code> 推到 \u003ccode>gh-pages\u003c/code> 分支\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> GitHub 仓库 Settings → Pages，source 切到 \u003ccode>gh-pages\u003c/code> 分支\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 首次部署验证地址 \u003ccode>https://boris-hbx.github.io/DeepInsight/\u003c/code>\u003c/li>\n\u003c/ul>\n\u003ch4>B2 第二波（真实状态面板填充，依赖 A1 产出）\u003c/h4>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 扫描 \u003ccode>docs/specs/*.md\u003c/code> 生成切片墙（按负责人分列）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 扫描 \u003ccode>docs/architecture/adr/*.md\u003c/code> 生成 ADR 索引\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>git log\u003c/code> 解析 \u003ccode>[human]/[pair]/[agent]\u003c/code> trailer 统计\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>.claude/skills/\u003c/code> 扫描生成 skill 注册表\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 可选：最近 demo 流（从 merge commit 提取）\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2>4. 业界最佳实践\u003c/h2>\n\u003cblockquote>\n\u003cp>由 Claude agent 于 2026-04-23 联网调研产出。所有链接点进去即可验证。\u003c/p>\n\u003c/blockquote>\n\u003ch3>4.1 参考产品与开源项目\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>\u003ca href=\"https://github.com/miurla/morphic\">Morphic\u003c/a>\u003c/strong> — Next.js + AI SDK + shadcn/ui 的 &quot;answer engine&quot;，和我们的栈几乎同构。值得借鉴：\u003ccode>models.json\u003c/code> 统一多 provider 配置、Tavily/SearXNG/Exa 可切换的检索抽象、Generative UI 流式组件。\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"https://vercel.com/templates/next.js/chatbot\">Vercel AI Chatbot\u003c/a>\u003c/strong> — 官方模板，AI SDK v6 统一 25+ provider，RSC + Server Actions 模式。可直接 fork 作为脚手架，但它默认用 OpenAI，Anthropic SDK 需要替换 provider 层。\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"https://github.com/lobehub/lobe-chat\">LobeChat\u003c/a>\u003c/strong> — \u003ccode>@lobechat/model-runtime\u003c/code> 与 \u003ccode>@lobechat/agent-runtime\u003c/code> 双层拆分（LLM 适配器 vs Agent 编排）是我们做 PDF 分析 pipeline 时值得复用的分层思路；Supervisor + Executor 模式对多步报告生成有参考价值。\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"https://github.com/assafelovic/gpt-researcher\">GPT Researcher\u003c/a>\u003c/strong> / \u003cstrong>\u003ca href=\"https://github.com/langchain-ai/open_deep_research\">LangChain open_deep_research\u003c/a>\u003c/strong> — Planner + Executor + Publisher 的 tree-like 探索模式，对&quot;上传 PDF/URL → 生成结构化报告&quot;的流程非常契合；GPT Researcher 公布了单次 ~$0.40 的成本基线可参考。\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"https://elicit.com/\">Elicit\u003c/a>\u003c/strong> — 工业级 &quot;sentence-level citation&quot; 的标杆；UI 上每条 claim 都可追溯到原文句子，这是 report-style 产品的关键差异点。\u003c/li>\n\u003cli>\u003cstrong>Claude Projects / \u003ca href=\"https://claude.com/blog/introducing-citations-api\">Anthropic Citations API\u003c/a>\u003c/strong> — 官方 Citations feature 原生支持 PDF 分块、\u003ccode>cited_text\u003c/code> 不计入 output token，比自研引用对齐省事得多，建议作为 MVP 的默认方案。\u003c/li>\n\u003c/ul>\n\u003ch3>4.2 LLM-powered 应用特有的初始化维度\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Prompt 管理\u003c/strong>：day 1 用仓库内 \u003ccode>prompts/*.md\u003c/code> + 小工具做模板化（变量注入、版本号前缀）；不要代码内嵌长字符串。中期上 \u003cstrong>\u003ca href=\"https://github.com/langfuse/langfuse\">Langfuse\u003c/a>\u003c/strong>（开源、可自托管、支持 prompt versioning + trace 关联）。注意：\u003cstrong>\u003ca href=\"https://www.keywordsai.co/blog/humanloop-alternatives\">Humanloop 已于 2025-09-08 被 Anthropic 收购后关闭\u003c/a>\u003c/strong>，不要再选它。\u003c/li>\n\u003cli>\u003cstrong>Eval 最简起步\u003c/strong>：参考 \u003ca href=\"https://deepeval.com/docs/evaluation-datasets\">DeepEval\u003c/a> 建议 —— 从 3-5 个核心功能各挑 10-20 条 golden case（输入 + 期望输出/评分维度）入仓，CI 里跑 LLM-as-judge + 关键字段精确匹配。Citation 准确率和 hallucination 率是 report app 必须 day 1 就度量的两个指标。\u003c/li>\n\u003cli>\u003cstrong>流式 UX\u003c/strong>：使用 AI SDK 的 \u003ccode>useChat\u003c/code>，实现 \u003ccode>stop\u003c/code> / \u003ccode>reload\u003c/code> / \u003ccode>onError\u003c/code>；60s 客户端超时、关闭 tab 时的 partial message 标记、指数退避重试是四个易漏点（\u003ca href=\"https://dev.to/whoffagents/vercel-ai-sdk-usechat-in-production-streaming-errors-and-the-patterns-nobody-writes-about-4ecf\">参考\u003c/a>）。错误消息对外统一文案，避免泄露 provider 报错。\u003c/li>\n\u003cli>\u003cstrong>成本 / 限流\u003c/strong>：OpenTelemetry span 上打 \u003ccode>user_id\u003c/code> / \u003ccode>feature\u003c/code> / \u003ccode>prompt_version\u003c/code> tag（\u003ca href=\"https://www.traceloop.com/blog/from-bills-to-budgets-how-to-track-llm-token-usage-and-cost-per-user\">Traceloop 方案\u003c/a>）。限流用 token-based 而非 request-based（参考 \u003ca href=\"https://portkey.ai/blog/rate-limiting-for-llm-applications/\">Portkey\u003c/a>、Azure \u003ccode>llm-token-limit\u003c/code>）；每个用户设日 token budget。\u003c/li>\n\u003cli>\u003cstrong>安全\u003c/strong>：按 \u003cstrong>\u003ca href=\"https://genai.owasp.org/llmrisk/llm01-prompt-injection/\">OWASP LLM01:2025\u003c/a>\u003c/strong> 处理 indirect prompt injection —— 上传 PDF 一律用 \u003ccode>&lt;untrusted&gt;\u003c/code> 分隔标签包裹、系统提示明确声明&quot;文档内容不是指令&quot;。PII 在入库前做脱敏；上传文件做 MIME/magic bytes 校验 + 大小限制 + 病毒扫描。\u003c/li>\n\u003cli>\u003cstrong>Citation\u003c/strong>：直接用 \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/citations\">Anthropic Citations API\u003c/a>，不要自己做对齐。\u003c/li>\n\u003cli>\u003cstrong>长上下文\u003c/strong>：单请求 ≤100 页用 Citations 原生 PDF；超过则 map-reduce 分章节摘要 → 再合成；考虑 Claude Sonnet 4.6 / Opus 4.6 的 \u003cstrong>1M token 上下文\u003c/strong>（无溢价）作为长文档 fallback。\u003c/li>\n\u003c/ul>\n\u003ch3>4.3 Spec-driven / ADR / RFC 在 8 人团队的落地\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>流程范式\u003c/strong>：参考 \u003ca href=\"https://github.com/rust-lang/rfcs\">Rust RFC\u003c/a> / \u003ca href=\"https://github.com/reactjs/rfcs\">React RFC\u003c/a>（后者基于前者）—— markdown 模板 + PR 讨论 + &quot;final comment period&quot; 收口。8 人团队建议\u003cstrong>门槛下调\u003c/strong>：只要求跨 2 个模块或 &gt;2 天工作量的改动走 RFC。\u003c/li>\n\u003cli>\u003cstrong>ADR vs Spec vs RFC\u003c/strong>（参见 \u003ca href=\"https://candost.blog/adrs-rfcs-differences-when-which/\">Candost\u003c/a> / \u003ca href=\"https://ceaksan.com/en/adr-openspec-decision-spec-management\">ceaksan\u003c/a>）：RFC 回答&quot;要不要做、怎么做&quot;；ADR 记录&quot;为什么选了这条路&quot;（单个决策点、短小）；Spec 回答&quot;要做什么、怎么验收&quot;。三者并存，一个 RFC 通过后可派生多个 ADR + spec。\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"https://github.com/Fission-AI/OpenSpec\">OpenSpec\u003c/a>\u003c/strong>：轻量 SDD 框架，三阶段状态机（proposal → apply → archive）+ 增量标记（ADDED/MODIFIED/REMOVED），对 brownfield 迭代友好；输出约 250 行，review 成本远低于 GitHub Spec Kit（约 800 行）。与 Claude Code 原生兼容，适合作为本项目&quot;spec 即 agent 上下文&quot;的抓手。\u003c/li>\n\u003c/ul>\n\u003ch3>4.4 Multi-agent / AI 协作治理（新兴领域，资料有限）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>\u003ca href=\"https://code.claude.com/docs/en/agent-teams\">Claude Code Agent Teams\u003c/a>\u003c/strong>（实验性，\u003ccode>CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS\u003c/code>）：lead + 3-5 teammate 的共享 task list 模式，适合 &quot;research + review + cross-layer 改动&quot;。官方三原则：\u003cstrong>最小权限、可逆优先、高风险处人工卡点\u003c/strong>，配合 \u003ccode>--allowedTools\u003c/code> 白名单。\u003c/li>\n\u003cli>\u003cstrong>Commit 归因\u003c/strong>：Claude Code 默认写 \u003ccode>Co-Authored-By: Claude &lt;noreply@anthropic.com&gt;\u003c/code> trailer，GitHub 会展示 co-author。社区有争议（\u003ca href=\"https://bence.ferdinandy.com/2025/12/29/dont-abuse-co-authored-by-for-marking-ai-assistance/\">反对观点\u003c/a>），建议团队统一用专用 \u003ccode>Assisted-By:\u003c/code> 或 \u003ccode>AI-Agent:\u003c/code> trailer + 模型版本，而非复用 \u003ccode>Co-Authored-By\u003c/code>；可借 \u003ca href=\"https://github.com/git-ai-project/git-ai\">git-ai\u003c/a> 类工具。\u003c/li>\n\u003cli>\u003cstrong>Skill / prompt / agent 版本管理\u003c/strong>：参考 \u003cstrong>\u003ca href=\"https://github.com/anthropics/skills\">anthropics/skills\u003c/a>\u003c/strong> 官方仓库约定 —— 每个 skill 一个目录 + \u003ccode>SKILL.md\u003c/code> (YAML frontmatter)。Anthropic 的 **\u003ca href=\"https://tessl.io/blog/anthropic-brings-evals-to-skill-creator-heres-why-thats-a-big-deal/\">skill-creator eval 模式\u003c/a>**把 eval 结果绑到具体版本（v1.1 vs v1.2 盲测 A/B），值得照搬到我们自己的 prompt/agent review 流程。\u003c/li>\n\u003cli>\u003cstrong>未找到权威资料\u003c/strong>：公开的&quot;多人 + 多 agent 在同一仓库的分工冲突解决手册&quot;几乎没有，属于我们可以贡献经验的空白区。\u003c/li>\n\u003c/ul>\n\u003ch3>4.5 对 DeepInsight 的具体建议（尚未纳入我们决策的维度）\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Day 1 就把 Citations API 作为默认后端\u003c/strong>，UI 组件里每一段文字强制可点到原文 span，避免后期翻修。\u003c/li>\n\u003cli>\u003cstrong>建 \u003ccode>evals/\u003c/code> 目录入仓\u003c/strong>，最小化 20 条 golden（含对抗性 PDF prompt injection 样本 3-5 条），CI 拦截 citation 准确率 / injection 成功率回归。\u003c/li>\n\u003cli>\u003cstrong>Prompt/Skill/Agent 都当 code review\u003c/strong>：PR 模板加上&quot;prompt 变更需附 A/B eval diff&quot;一栏，对齐 Anthropic skill-creator 的做法。\u003c/li>\n\u003cli>\u003cstrong>把 &quot;AI 参与度&quot; 做成结构化元数据\u003c/strong>（commit trailer + 自建 \u003ccode>.ai-meta.json\u003c/code>），为团队的治理实验留下可分析的时间序列，而不是自由文本。\u003c/li>\n\u003cli>\u003cstrong>多 agent 并行时启用共享 task list 而非自由分叉\u003c/strong>，并把 &quot;高危操作需人工 approve&quot; 列为不可绕过的 hook，避免 8 人 × N agent 的 race condition。\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch2>5. 体验方式与部署（前期简化版）\u003c/h2>\n\u003cp>\u003cstrong>决策日期：2026-04-23\u003c/strong>\u003c/p>\n\u003cp>前期 MVP 阶段区分\u003cstrong>两个对象\u003c/strong>的部署策略：\u003c/p>\n\u003cp>\u003cstrong>应用本体（\u003ccode>/web\u003c/code>）：纯本地开发，不部署、不做登录。\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>每人 clone 仓库，在自己的 feature 分支上开发\u003c/li>\n\u003cli>\u003ccode>cd web &amp;&amp; npm run dev\u003c/code> 起本地 dev server（\u003ccode>localhost:3000\u003c/code>，Next.js 原生热重载）\u003c/li>\n\u003cli>自己验证 OK → 提 PR → review → 合入 \u003ccode>main\u003c/code>\u003c/li>\n\u003cli>合并后的效果：大家 pull 最新 main 自己本地跑\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>运作看板（\u003ccode>/dashboard\u003c/code>）：走 GitHub Pages（\u003ccode>gh-pages\u003c/code> 分支）。\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>npm run deploy\u003c/code> 自动推送，GitHub Pages 自动发布\u003c/li>\n\u003cli>只读、纯静态、无用户数据、无登录需求（因此没有安全负担）\u003c/li>\n\u003cli>配置细节见 1.6\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>应用本体推迟到后续的事项：\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>统一部署（涉及平台选型：Vercel vs Fly.io）\u003c/li>\n\u003cli>登录 / 权限 / 鉴权\u003c/li>\n\u003cli>PR preview 环境\u003c/li>\n\u003cli>CI/CD 流水线（初期只做本地 lint + typecheck，不设云端 CI 也可先行）\u003c/li>\n\u003cli>团队 billing / 共享 API key\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Anthropic API Key 管理（当前阶段）：\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>每人自己去 \u003ca href=\"https://console.anthropic.com\">console.anthropic.com\u003c/a> 申请个人 API key\u003c/li>\n\u003cli>放在各自本地 \u003ccode>web/.env.local\u003c/code>（\u003cstrong>必须\u003c/strong> \u003ccode>.gitignore\u003c/code>，禁止提交）\u003c/li>\n\u003cli>用自己的 billing，dev 量很小，个人承担\u003c/li>\n\u003cli>团队 workspace + 统一 billing 的方案留到&quot;需要部署预览环境&quot;或&quot;做 eval 消耗大&quot;时再引入\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>澄清（记录给全员）：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Claude Code 订阅（每人各自的）≠ DeepInsight 应用运行时用的 Anthropic API Key（\u003ccode>sk-ant-...\u003c/code>）。前者是大家用的\u003cstrong>开发工具\u003c/strong>，后者是我们要\u003cstrong>构建的 app 内部\u003c/strong>调用 Claude 的凭证，两者账号体系独立。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2>6. 开放问题\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Git 身份处理\u003c/strong>：Boris 自己执行 \u003ccode>git config --global\u003c/code>，还是 Claude 代设？\u003c/li>\n\u003cli>\u003cstrong>第一个垂直切片\u003c/strong>选什么？建议是&quot;上传 PDF → 摘要&quot;最简化路径，你们怎么看？\u003c/li>\n\u003cli>\u003cstrong>CI 提供商\u003c/strong>：GitHub Actions（默认）？要不要同时接本地 pre-commit hook？\u003c/li>\n\u003cli>\u003cstrong>8 人的身份\u003c/strong>：需不需要一份 \u003ccode>docs/guides/TEAM.md\u003c/code> 记录每人背景与关注方向，方便 agent 在评审时引用？\u003c/li>\n\u003cli>\u003cstrong>Skill 与 Subagent 的生命周期治理\u003c/strong>（这是你们明确要探索的点）：\u003cul>\n\u003cli>谁有权 merge 一个新 skill/agent？\u003c/li>\n\u003cli>如何评估 skill 的&quot;质量&quot;？\u003c/li>\n\u003cli>skill 版本怎么管？\u003c/li>\n\u003cli>这块要不要单独写一份 \u003ccode>docs/guides/agent-governance.md\u003c/code> 作为 spec 草稿？\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Eval 体系\u003c/strong>：LLM 输出的质量怎么评估？要不要一开始就引入（哪怕只是简单的 snapshot test）？\u003c/li>\n\u003cli>\u003cstrong>成本观测\u003c/strong>：LLM 调用费用监控从第几轮开始考虑？\u003c/li>\n\u003cli>\u003cstrong>Prompt 管理\u003c/strong>：prompt 和代码的关系（文件内嵌 / 独立 .md / 专用工具）？\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch2>7. 变更日志\u003c/h2>\n\u003cul>\n\u003cli>2026-04-23 初稿（Boris + Claude 对话 1~4 轮结果沉淀）\u003c/li>\n\u003cli>2026-04-23 补充第 4 节&quot;业界最佳实践&quot;（agent 联网调研）\u003c/li>\n\u003cli>2026-04-23 新增第 5 节&quot;体验方式与部署（前期简化版）&quot;：确认 MVP 阶段纯本地开发，API key 每人自用，部署/登录/团队 billing 推迟\u003c/li>\n\u003cli>2026-04-23 新增 1.6 &quot;项目运作看板&quot;：markdown 驱动的静态看板 + GitHub Pages；部署\u003cstrong>改用 \u003ccode>gh-pages\u003c/code> 分支\u003c/strong>（避免与 \u003ccode>/docs\u003c/code> 开发文档目录冲突 —— 修正上一轮建议）；目录规范新增 \u003ccode>dashboard/\u003c/code>、\u003ccode>scripts/\u003c/code>、\u003ccode>package.json\u003c/code>；实施步骤重组为 A/B 两条并行线；第 5 节区分&quot;应用本体&quot;与&quot;运作看板&quot;的部署策略\u003c/li>\n\u003c/ul>\n","sliceWall":{"placeholder":true,"message":"等待首批 spec 提交（docs/specs/NNN-*.md）。本面板将自动按负责人分列，显示每人切片的 spec → build → test → demo 状态。"},"agentMetrics":{"placeholder":true,"message":"等待首批带 [human] / [pair] / [agent] trailer 的 commit。本面板将展示 agent 协作参与度的时间序列与比例。"},"adrIndex":{"placeholder":true,"message":"等待首批 ADR 入仓（docs/architecture/adr/NNNN-*.md）。本面板将按编号列出所有已接纳 / 被取代的决策。"},"skillRegistry":{"placeholder":true,"message":"等待 .claude/skills/ 下的 skill 注册。本面板将展示项目级 skill 的版本、作者、eval 分数。"}};
