<script>
window.DEEPINSIGHT_DATA = {"generatedAt":"2026-04-25T04:37:33.956Z","title":"DeepInsight 项目运作看板","version":"v1.0","repoUrl":"https://github.com/Boris-hbx/DeepInsight","pagesUrl":"https://boris-hbx.github.io/DeepInsight/","manualHtml":"\u003ch1>DeepInsight 项目章程\u003c/h1>\n\u003cblockquote>\n\u003cp>状态：\u003cstrong>已生效（项目元决策的根本记录）\u003c/strong>\n作者：阿宝 + Claude\n最后更新：2026-04-25\n这是 DeepInsight 启动期&quot;为什么这样设计&quot;的根本记录。后续新增\u003cstrong>不在此处\u003c/strong>做：\u003c/p>\n\u003cul>\n\u003cli>新约定 → \u003ccode>CLAUDE.md\u003c/code> / \u003ccode>docs/guides/CONTRIBUTING.md\u003c/code>\u003c/li>\n\u003cli>新架构决策 → \u003ccode>docs/architecture/adr/\u003c/code>\u003c/li>\n\u003cli>任务令 / 责任田 / 探索期 / 业界参考 → 看板\n章节锚点（章程 § X.Y）会被其他文档引用，\u003cstrong>不要随意改章节号\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003c/blockquote>\n\u003chr>\n\u003ch2>常用 prompt\u003c/h2>\n\u003cblockquote>\n\u003cp>8 人协作的&quot;一句话指令&quot;集合。所有约束（路径归档、commit 规范、不动他人目录等）都下沉到 \u003ccode>CLAUDE.md\u003c/code> / \u003ccode>.claude/skills/\u003c/code> / git hooks 里——同事只需照搬下面的 prompt，agent 走完剩下的事。\u003c/p>\n\u003cp>本节是占位 + 首个样例，后续随着基础设施逐项落地会刷新内容。\u003c/p>\n\u003c/blockquote>\n\u003ch3>1. 我是新人，怎么开始？\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">我是新人，怎么开始？\n\u003c/code>\u003c/pre>\n\u003cp>agent 会自动：① 检查环境（\u003ccode>git config\u003c/code> / Node / 看板依赖）；② 从 \u003ccode>git config user.email\u003c/code> 反查 \u003ccode>docs/guides/TEAM.md\u003c/code> 推断你的代号，\u003cstrong>不准就让你确认\u003c/strong>；③ 写 \u003ccode>.claude/settings.local.json\u003c/code>（注入 \u003ccode>$DEEPINSIGHT_HANDLE\u003c/code>）+ 从 \u003ccode>explorations/_template/\u003c/code> 复制起步文件到 \u003ccode>explorations/&lt;代号&gt;/\u003c/code> + 配 git hooks；④ 提示你\u003cstrong>关掉 Claude Code 再开一个\u003c/strong>让环境变量生效；⑤ 重开后说 &quot;我要做一个 X 的 demo&quot; 即可开工。\u003c/p>\n\u003cblockquote>\n\u003cp>完全不需要记任何命令。只要 \u003ccode>git clone\u003c/code> 仓库 → 用 VS Code 打开 → 启动 Claude Code，剩下都靠这一句。\n接住的 skill：\u003ccode>.claude/skills/onboard.md\u003c/code> ✅（已落地）。\u003c/p>\n\u003c/blockquote>\n\u003ch3>2. 出一个本地可看的洞察 demo\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">我要做一个洞察 demo，主题是 &lt;在此填主题&gt;。\n\u003c/code>\u003c/pre>\n\u003cp>agent 会自动：① 在 \u003ccode>explorations/$DEEPINSIGHT_HANDLE/\u003c/code> 生成自包含的 \u003ccode>index.html\u003c/code>（双击可开）；② 用 mock 数据展示设想，\u003cstrong>不调真 LLM API\u003c/strong>（前期纯静态）；③ 不动 \u003ccode>/web\u003c/code> 主应用，也不动其他同事的 \u003ccode>explorations/&lt;other&gt;/\u003c/code>；④ 完成后告诉你打开命令。\u003c/p>\n\u003cblockquote>\n\u003cp>接住的 skill：\u003ccode>.claude/skills/explore-mode.md\u003c/code> ✅（已落地）。前置：先用 prompt 1 跑过 onboard 设好 \u003ccode>$DEEPINSIGHT_HANDLE\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2>0. 项目一页纸（Project One-Pager）\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>项目名\u003c/td>\n\u003ctd>DeepInsight\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>目标\u003c/td>\n\u003ctd>做&quot;洞察分析&quot;应用：用户以看报告为主，可上传 PDF、粘贴论文/博客链接，支持多模态输入与分析\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>形态\u003c/td>\n\u003ctd>一期：Web；二期：手机 App（后续再设计）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>团队\u003c/td>\n\u003ctd>8 人，跨领域：研发范式、软件工程、系统设计、可靠性、测试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>双重目标\u003c/td>\n\u003ctd>①交付一个真实可用的产品；②作为&quot;先进 code agent 协作&quot;的沙盒 —— 探索多人+多 agent、spec 质量、skill 生命周期、subagent、工程规范\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>仓库\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/Boris-hbx/DeepInsight%EF%BC%88%E5%B7%B2%E5%85%8B%E9%9A%86%E8%87%B3\">https://github.com/Boris-hbx/DeepInsight（已克隆至\u003c/a> \u003ccode>C:\\Project\\DeepInsight\u003c/code>，\u003cstrong>公开仓库\u003c/strong>，目前为空）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2>1. 已确认的决策\u003c/h2>\n\u003ch3>1.1 技术栈：方案 A\u003c/h3>\n\u003cp>\u003cstrong>Next.js (App Router) + TypeScript + Tailwind CSS + shadcn/ui\u003c/strong>\u003c/p>\n\u003cp>理由：\u003c/p>\n\u003cul>\n\u003cli>前后端一体，8 人心智负担最小\u003c/li>\n\u003cli>单语言（TS）降低沟通成本\u003c/li>\n\u003cli>Anthropic SDK 有 TS 官方支持，多模态调用顺\u003c/li>\n\u003cli>React 组件未来可部分迁移到 React Native / Expo，为二期 mobile 留退路\u003c/li>\n\u003c/ul>\n\u003cp>多模态相关（待在 ADR 或 spec 中细化）：\u003c/p>\n\u003cul>\n\u003cli>PDF 解析（备选：\u003ccode>pdf-parse\u003c/code> / \u003ccode>unpdf\u003c/code> / Claude Files API 直接上传）\u003c/li>\n\u003cli>URL 抓取（备选：\u003ccode>@mozilla/readability\u003c/code> + \u003ccode>jsdom\u003c/code> / 外部 scraper API）\u003c/li>\n\u003cli>LLM：Anthropic Claude（多模态 + 长上下文适合长文档 insight）\u003c/li>\n\u003c/ul>\n\u003ch3>1.2 仓库策略\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>单仓库 + \u003ccode>/web\u003c/code> 子目录\u003c/strong>，暂不引入 monorepo 工具（pnpm workspaces / Turborepo）\u003c/li>\n\u003cli>理由：8 人规模不值得；二期 mobile 出现时再升级，届时 \u003ccode>/web\u003c/code> 已是自然的子包\u003c/li>\n\u003cli>\u003ccode>main\u003c/code> 分支保护，禁止直推\u003c/li>\n\u003cli>分支命名：\u003ccode>feat/&lt;name&gt;/&lt;slug&gt;\u003c/code>、\u003ccode>fix/&lt;name&gt;/&lt;slug&gt;\u003c/code>、\u003ccode>spec/&lt;name&gt;/&lt;slug&gt;\u003c/code>\u003c/li>\n\u003cli>PR 必须关联一个 \u003ccode>docs/specs/NNN-*.md\u003c/code>\u003c/li>\n\u003cli>≥1 人 review + CI 绿灯 才能合并\u003c/li>\n\u003c/ul>\n\u003ch3>1.3 协作模式：人人端到端（everyone owns a slice）\u003c/h3>\n\u003cp>每个人独立跑通一条垂直切片的全流程：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Proposal\u003c/strong> → \u003ccode>docs/specs/NNN-*.md\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>Review\u003c/strong>：同事 comment；reliability / test 背景的人把检查项沉淀进 spec 模板\u003c/li>\n\u003cli>\u003cstrong>Build\u003c/strong>：feature 分支 + Claude / subagent 协作\u003c/li>\n\u003cli>\u003cstrong>Test\u003c/strong>：按自己 spec 的测试策略实现\u003c/li>\n\u003cli>\u003cstrong>Demo\u003c/strong>：合并后在团队 sync 演示\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>横向角色的杠杆点：\u003c/strong> reliability / test / SE 规范背景的人不做审批网关，做\u003cstrong>规范作者\u003c/strong> —— 他们的产出是：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>.claude/skills/\u003c/code> 下的 skill（可被全员自动触发）\u003c/li>\n\u003cli>\u003ccode>docs/specs/TEMPLATE.md\u003c/code> 里的检查项槽位\u003c/li>\n\u003cli>CI 中的自动化门禁\u003c/li>\n\u003c/ul>\n\u003cp>这样他们既有纵向的 slice 体验，又有横向影响力。\u003c/p>\n\u003cp>\u003cstrong>副轴补充（2026-04-23）：责任田（守护人制度）\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主轴仍是垂直切片；副轴是 8 片横向责任田（Z-1 ~ Z-8），每人额外守护一片\u003c/li>\n\u003cli>守护人 ≠ 审批网关（保留上文禁区），= 规范/skill/CI 作者 + 默认 reviewer + 问题路由节点\u003c/li>\n\u003cli>8 片划分 + 认领规则 + 交接机制详见 \u003cstrong>\u003ccode>docs/stewardship.md\u003c/code>\u003c/strong>（真源），看板的「责任田」Tab 是视图\u003c/li>\n\u003cli>分配\u003cstrong>待开工会议认领\u003c/strong>，一人最多守护 2 片，Z-2 移动端当前体量小可搭售\u003c/li>\n\u003c/ul>\n\u003ch3>1.4 Agent 协作元数据\u003c/h3>\n\u003cp>commit message 约定标注 agent 参与程度（方便后续复盘&quot;探索&quot;数据）：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>[human]\u003c/code> 纯人类\u003c/li>\n\u003cli>\u003ccode>[pair]\u003c/code> 人机协作\u003c/li>\n\u003cli>\u003ccode>[agent]\u003c/code> agent 主导、人类 review\u003c/li>\n\u003c/ul>\n\u003ch3>1.5 Git 身份\u003c/h3>\n\u003cul>\n\u003cli>团队每人使用自己的 GitHub 账号邮箱（阿宝的是 \u003ccode>baoxing2391@163.com\u003c/code>）\u003c/li>\n\u003cli>\u003cstrong>待确认：\u003c/strong> 阿宝当前 shell 中 git global 为空，需本地配一次 \u003ccode>git config --global user.email ...\u003c/code>；或者 Claude 代为设置（方式待定）\u003c/li>\n\u003c/ul>\n\u003ch3>1.6 项目运作看板\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>目的\u003c/strong>：让 8 人随时看到项目运作状态（特性切片进度、spec/ADR 索引、agent 协作度、运作手册）\u003c/li>\n\u003cli>\u003cstrong>形态\u003c/strong>：纯 HTML/CSS/JS 静态看板（继承 \u003ccode>C:\\Project\\pm-dashboard\u003c/code> 的风格，\u003cstrong>不\u003c/strong>引入 Next.js / React）\u003c/li>\n\u003cli>\u003cstrong>数据源\u003c/strong>：markdown 驱动 —— 自动解析 \u003ccode>项目章程.md\u003c/code>、\u003ccode>docs/specs/*.md\u003c/code>、\u003ccode>docs/architecture/adr/*.md\u003c/code>；\u003ccode>git log\u003c/code> 为辅（统计 commit 的 agent trailer）\u003c/li>\n\u003cli>\u003cstrong>部署\u003c/strong>：GitHub Pages（仓库已公开），地址 \u003ccode>https://boris-hbx.github.io/DeepInsight/\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>⚠ 部署分支选择\u003c/strong>：用 \u003cstrong>\u003ccode>gh-pages\u003c/code> 分支\u003c/strong> 而不是 \u003ccode>main\u003c/code> 的 \u003ccode>/docs\u003c/code> 文件夹 —— 原因是 \u003ccode>/docs\u003c/code> 已被规划为开发文档目录（specs / ADR / guides），不能覆写。\u003ccode>npm run deploy\u003c/code> 会把构建产物推到 \u003ccode>gh-pages\u003c/code> 分支，GitHub Pages 自动发布（这是对上一轮&quot;用 docs/ 文件夹&quot;方案的修正）\u003c/li>\n\u003cli>\u003cstrong>两类内容\u003c/strong>：\u003cul>\n\u003cli>\u003cstrong>运作手册\u003c/strong>（静态）：从本草稿 md 抽取，含一页纸、决策、spec 流程、目录规范、开放问题\u003c/li>\n\u003cli>\u003cstrong>实时状态\u003c/strong>（动态）：\u003cstrong>任务看板\u003c/strong>（按 8 位同事分卡片渲染 \u003ccode>docs/task-board.md\u003c/code>）、特性切片墙、agent 协作度统计、Skill/Subagent 注册表、ADR 索引、最近 demo\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>启动策略（分两波）\u003c/strong>：\u003cul>\n\u003cli>第一波：空壳 + 运作手册渲染，让 8 人能看到&quot;规则怎么跑&quot;\u003c/li>\n\u003cli>第二波：等有真实 spec/commit 后，状态面板自动填充\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>原则\u003c/strong>：草稿 md 是\u003cstrong>唯一真源\u003c/strong>，看板是\u003cstrong>视图\u003c/strong>；改 md → \u003ccode>npm run build\u003c/code> 重渲染，一致性由工具保证\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2>2. 目录规范（待评审）\u003c/h2>\n\u003cpre>\u003ccode>DeepInsight/\n├── CLAUDE.md                   # 项目级 Claude Code 指引\n├── README.md                   # 项目简介 + 快速开始\n├── 项目章程.md            # 本文档（实施后归档或删除）\n├── 项目章程.html          # 本文档的渲染版（浏览器阅读用）\n├── package.json                # 看板构建脚本依赖（轨道 B）\n├── .gitignore\n├── docs/                       # 开发文档（仓库内阅读；不走 GitHub Pages）\n│   ├── task-board.md           # 任务看板真源（T-xxx 令 + 接令回写）\n│   ├── architecture/\n│   │   └── adr/                # Architecture Decision Records（NNNN-title.md）\n│   ├── specs/                  # 特性 proposal（NNN-slug.md）\n│   │   └── TEMPLATE.md\n│   ├── guides/                 # 贡献指南、开发手册\n│   │   └── CONTRIBUTING.md\n│   └── assets/\n│       ├── screenshots/        # UI/bug 截图（YYYY-MM-DD-desc.png）\n│       └── diagrams/           # 架构图/流程图源文件\n├── dashboard/                  # 运作看板源码（与 /web 解耦）\n│   ├── index.html\n│   ├── assets/\n│   │   ├── style.css\n│   │   └── main.js\n│   └── data.json               # 构建产物（gitignore，每次 build 生成）\n├── scripts/\n│   └── build-dashboard.js      # 扫描 md + git log → data.json → dist/\n├── web/                        # Next.js 应用\n├── .claude/                    # 项目级 Claude Code 配置\n│   ├── agents/                 # 项目 subagent 定义\n│   ├── skills/                 # 项目 skill\n│   └── settings.json           # 共享的权限、hook\n└── .github/\n    ├── PULL_REQUEST_TEMPLATE.md\n    └── workflows/              # CI（后续添加）\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>命名约定：\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>spec：\u003ccode>docs/specs/NNN-short-slug.md\u003c/code>，\u003ccode>NNN\u003c/code> 单调递增（001 起）\u003c/li>\n\u003cli>ADR：\u003ccode>docs/architecture/adr/NNNN-title.md\u003c/code>（4 位，业界惯例）\u003c/li>\n\u003cli>截图：\u003ccode>docs/assets/screenshots/YYYY-MM-DD-description.png\u003c/code>\u003c/li>\n\u003cli>图表源文件：\u003ccode>docs/assets/diagrams/&lt;name&gt;.{drawio,excalidraw,puml}\u003c/code>\u003c/li>\n\u003cli>看板发布：\u003ccode>gh-pages\u003c/code> 分支（GitHub Pages 自动识别），由 \u003ccode>npm run deploy\u003c/code> 推送 —— \u003cstrong>不进 \u003ccode>main\u003c/code> 分支\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2>3. 实施步骤（两条并行轨道）\u003c/h2>\n\u003cblockquote>\n\u003cp>分两条\u003cstrong>并行\u003c/strong>推进：\u003cstrong>轨道 A\u003c/strong>（应用本体）仍是治理 → 技术栈 → 业务脚手架三层；\u003cstrong>轨道 B\u003c/strong>（运作看板）独立成线，与 A 无阻塞关系。轨道 B 先出成果，能让 8 人立刻看到&quot;运作规则&quot;。\u003c/p>\n\u003c/blockquote>\n\u003ch3>轨道 A：应用本体\u003c/h3>\n\u003ch4>A1 第一轮（治理层，本次）\u003c/h4>\n\u003cul>\n\u003cli>\u003cinput checked=\"\" disabled=\"\" type=\"checkbox\"> \u003ccode>README.md\u003c/code>\u003c/li>\n\u003cli>\u003cinput checked=\"\" disabled=\"\" type=\"checkbox\"> \u003ccode>.gitignore\u003c/code>（Node/Next.js + IDE + OS + \u003ccode>dashboard/data.json\u003c/code> + \u003ccode>dist/\u003c/code>）\u003c/li>\n\u003cli>\u003cinput checked=\"\" disabled=\"\" type=\"checkbox\"> \u003ccode>CLAUDE.md\u003c/code>\u003c/li>\n\u003cli>\u003cinput checked=\"\" disabled=\"\" type=\"checkbox\"> \u003ccode>docs/specs/TEMPLATE.md\u003c/code>（含 reliability/test checklist 槽位）\u003c/li>\n\u003cli>\u003cinput checked=\"\" disabled=\"\" type=\"checkbox\"> \u003ccode>docs/guides/CONTRIBUTING.md\u003c/code>（分支、PR、review 流程）\u003c/li>\n\u003cli>\u003cinput checked=\"\" disabled=\"\" type=\"checkbox\"> \u003ccode>docs/architecture/adr/0000-record-architecture-decisions.md\u003c/code>（采纳 ADR）\u003c/li>\n\u003cli>\u003cinput checked=\"\" disabled=\"\" type=\"checkbox\"> \u003ccode>.github/PULL_REQUEST_TEMPLATE.md\u003c/code>\u003c/li>\n\u003cli>\u003cinput checked=\"\" disabled=\"\" type=\"checkbox\"> 占位 \u003ccode>.gitkeep\u003c/code>：\u003ccode>docs/assets/screenshots/\u003c/code>、\u003ccode>docs/assets/diagrams/\u003c/code>、\u003ccode>.claude/agents/\u003c/code>、\u003ccode>.claude/skills/\u003c/code>\u003c/li>\n\u003c/ul>\n\u003ch4>A2 第二轮（技术栈）\u003c/h4>\n\u003cul>\n\u003cli>\u003cinput checked=\"\" disabled=\"\" type=\"checkbox\"> \u003ccode>web/\u003c/code> 目录 Next.js 脚手架（TS + Tailwind + shadcn/ui + Anthropic SDK）\u003c/li>\n\u003cli>\u003cinput checked=\"\" disabled=\"\" type=\"checkbox\"> 基础 \u003ccode>.eslintrc\u003c/code> / \u003ccode>prettier\u003c/code> / \u003ccode>tsconfig\u003c/code> 约定\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 首批 ADR：多模态后端选型、LLM 调用封装位置、状态管理（\u003cstrong>待决策 — 见下方问题\u003c/strong>）\u003c/li>\n\u003c/ul>\n\u003ch4>A3 第三轮（业务脚手架）\u003c/h4>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 第一个垂直切片：用户上传一份 PDF → 得到洞察摘要\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>.github/workflows/ci.yml\u003c/code>：lint + typecheck + test\u003c/li>\n\u003c/ul>\n\u003ch3>轨道 B：项目运作看板\u003c/h3>\n\u003ch4>B1 第一波（空壳 + 运作手册，可立即启动）\u003c/h4>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>package.json\u003c/code>（依赖：\u003ccode>gh-pages\u003c/code>、\u003ccode>gray-matter\u003c/code>、\u003ccode>marked\u003c/code>、\u003ccode>simple-git\u003c/code>）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>dashboard/index.html\u003c/code>（布局骨架：顶栏 + 运作手册 + 切片墙占位 + 协作度占位）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>dashboard/assets/style.css\u003c/code>（暗色系 + CSS 变量，继承 pm-dashboard 风格）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>dashboard/assets/main.js\u003c/code>（读 \u003ccode>data.json\u003c/code> 渲染）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>scripts/build-dashboard.js\u003c/code>：从 \u003ccode>项目章程.md\u003c/code> 提取章节 → \u003ccode>data.json\u003c/code>\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>npm run serve\u003c/code> 本地预览；\u003ccode>npm run deploy\u003c/code> 推到 \u003ccode>gh-pages\u003c/code> 分支\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> GitHub 仓库 Settings → Pages，source 切到 \u003ccode>gh-pages\u003c/code> 分支\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 首次部署验证地址 \u003ccode>https://boris-hbx.github.io/DeepInsight/\u003c/code>\u003c/li>\n\u003c/ul>\n\u003ch4>B2 第二波（真实状态面板填充，依赖 A1 产出）\u003c/h4>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 扫描 \u003ccode>docs/specs/*.md\u003c/code> 生成切片墙（按负责人分列）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 扫描 \u003ccode>docs/architecture/adr/*.md\u003c/code> 生成 ADR 索引\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>git log\u003c/code> 解析 \u003ccode>[human]/[pair]/[agent]\u003c/code> trailer 统计\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>.claude/skills/\u003c/code> 扫描生成 skill 注册表\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 可选：最近 demo 流（从 merge commit 提取）\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2>4. 业界最佳实践\u003c/h2>\n\u003cblockquote>\n\u003cp>由 Claude agent 于 2026-04-23 联网调研产出。所有链接点进去即可验证。\u003c/p>\n\u003c/blockquote>\n\u003ch3>4.1 参考产品与开源项目\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>\u003ca href=\"https://github.com/miurla/morphic\">Morphic\u003c/a>\u003c/strong> — Next.js + AI SDK + shadcn/ui 的 &quot;answer engine&quot;，和我们的栈几乎同构。值得借鉴：\u003ccode>models.json\u003c/code> 统一多 provider 配置、Tavily/SearXNG/Exa 可切换的检索抽象、Generative UI 流式组件。\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"https://vercel.com/templates/next.js/chatbot\">Vercel AI Chatbot\u003c/a>\u003c/strong> — 官方模板，AI SDK v6 统一 25+ provider，RSC + Server Actions 模式。可直接 fork 作为脚手架，但它默认用 OpenAI，Anthropic SDK 需要替换 provider 层。\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"https://github.com/lobehub/lobe-chat\">LobeChat\u003c/a>\u003c/strong> — \u003ccode>@lobechat/model-runtime\u003c/code> 与 \u003ccode>@lobechat/agent-runtime\u003c/code> 双层拆分（LLM 适配器 vs Agent 编排）是我们做 PDF 分析 pipeline 时值得复用的分层思路；Supervisor + Executor 模式对多步报告生成有参考价值。\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"https://github.com/assafelovic/gpt-researcher\">GPT Researcher\u003c/a>\u003c/strong> / \u003cstrong>\u003ca href=\"https://github.com/langchain-ai/open_deep_research\">LangChain open_deep_research\u003c/a>\u003c/strong> — Planner + Executor + Publisher 的 tree-like 探索模式，对&quot;上传 PDF/URL → 生成结构化报告&quot;的流程非常契合；GPT Researcher 公布了单次 ~$0.40 的成本基线可参考。\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"https://elicit.com/\">Elicit\u003c/a>\u003c/strong> — 工业级 &quot;sentence-level citation&quot; 的标杆；UI 上每条 claim 都可追溯到原文句子，这是 report-style 产品的关键差异点。\u003c/li>\n\u003cli>\u003cstrong>Claude Projects / \u003ca href=\"https://claude.com/blog/introducing-citations-api\">Anthropic Citations API\u003c/a>\u003c/strong> — 官方 Citations feature 原生支持 PDF 分块、\u003ccode>cited_text\u003c/code> 不计入 output token，比自研引用对齐省事得多，建议作为 MVP 的默认方案。\u003c/li>\n\u003c/ul>\n\u003ch3>4.2 LLM-powered 应用特有的初始化维度\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Prompt 管理\u003c/strong>：day 1 用仓库内 \u003ccode>prompts/*.md\u003c/code> + 小工具做模板化（变量注入、版本号前缀）；不要代码内嵌长字符串。中期上 \u003cstrong>\u003ca href=\"https://github.com/langfuse/langfuse\">Langfuse\u003c/a>\u003c/strong>（开源、可自托管、支持 prompt versioning + trace 关联）。注意：\u003cstrong>\u003ca href=\"https://www.keywordsai.co/blog/humanloop-alternatives\">Humanloop 已于 2025-09-08 被 Anthropic 收购后关闭\u003c/a>\u003c/strong>，不要再选它。\u003c/li>\n\u003cli>\u003cstrong>Eval 最简起步\u003c/strong>：参考 \u003ca href=\"https://deepeval.com/docs/evaluation-datasets\">DeepEval\u003c/a> 建议 —— 从 3-5 个核心功能各挑 10-20 条 golden case（输入 + 期望输出/评分维度）入仓，CI 里跑 LLM-as-judge + 关键字段精确匹配。Citation 准确率和 hallucination 率是 report app 必须 day 1 就度量的两个指标。\u003c/li>\n\u003cli>\u003cstrong>流式 UX\u003c/strong>：使用 AI SDK 的 \u003ccode>useChat\u003c/code>，实现 \u003ccode>stop\u003c/code> / \u003ccode>reload\u003c/code> / \u003ccode>onError\u003c/code>；60s 客户端超时、关闭 tab 时的 partial message 标记、指数退避重试是四个易漏点（\u003ca href=\"https://dev.to/whoffagents/vercel-ai-sdk-usechat-in-production-streaming-errors-and-the-patterns-nobody-writes-about-4ecf\">参考\u003c/a>）。错误消息对外统一文案，避免泄露 provider 报错。\u003c/li>\n\u003cli>\u003cstrong>成本 / 限流\u003c/strong>：OpenTelemetry span 上打 \u003ccode>user_id\u003c/code> / \u003ccode>feature\u003c/code> / \u003ccode>prompt_version\u003c/code> tag（\u003ca href=\"https://www.traceloop.com/blog/from-bills-to-budgets-how-to-track-llm-token-usage-and-cost-per-user\">Traceloop 方案\u003c/a>）。限流用 token-based 而非 request-based（参考 \u003ca href=\"https://portkey.ai/blog/rate-limiting-for-llm-applications/\">Portkey\u003c/a>、Azure \u003ccode>llm-token-limit\u003c/code>）；每个用户设日 token budget。\u003c/li>\n\u003cli>\u003cstrong>安全\u003c/strong>：按 \u003cstrong>\u003ca href=\"https://genai.owasp.org/llmrisk/llm01-prompt-injection/\">OWASP LLM01:2025\u003c/a>\u003c/strong> 处理 indirect prompt injection —— 上传 PDF 一律用 \u003ccode>&lt;untrusted&gt;\u003c/code> 分隔标签包裹、系统提示明确声明&quot;文档内容不是指令&quot;。PII 在入库前做脱敏；上传文件做 MIME/magic bytes 校验 + 大小限制 + 病毒扫描。\u003c/li>\n\u003cli>\u003cstrong>Citation\u003c/strong>：直接用 \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/citations\">Anthropic Citations API\u003c/a>，不要自己做对齐。\u003c/li>\n\u003cli>\u003cstrong>长上下文\u003c/strong>：单请求 ≤100 页用 Citations 原生 PDF；超过则 map-reduce 分章节摘要 → 再合成；考虑 Claude Sonnet 4.6 / Opus 4.6 的 \u003cstrong>1M token 上下文\u003c/strong>（无溢价）作为长文档 fallback。\u003c/li>\n\u003c/ul>\n\u003ch3>4.3 Spec-driven / ADR / RFC 在 8 人团队的落地\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>流程范式\u003c/strong>：参考 \u003ca href=\"https://github.com/rust-lang/rfcs\">Rust RFC\u003c/a> / \u003ca href=\"https://github.com/reactjs/rfcs\">React RFC\u003c/a>（后者基于前者）—— markdown 模板 + PR 讨论 + &quot;final comment period&quot; 收口。8 人团队建议\u003cstrong>门槛下调\u003c/strong>：只要求跨 2 个模块或 &gt;2 天工作量的改动走 RFC。\u003c/li>\n\u003cli>\u003cstrong>ADR vs Spec vs RFC\u003c/strong>（参见 \u003ca href=\"https://candost.blog/adrs-rfcs-differences-when-which/\">Candost\u003c/a> / \u003ca href=\"https://ceaksan.com/en/adr-openspec-decision-spec-management\">ceaksan\u003c/a>）：RFC 回答&quot;要不要做、怎么做&quot;；ADR 记录&quot;为什么选了这条路&quot;（单个决策点、短小）；Spec 回答&quot;要做什么、怎么验收&quot;。三者并存，一个 RFC 通过后可派生多个 ADR + spec。\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"https://github.com/Fission-AI/OpenSpec\">OpenSpec\u003c/a>\u003c/strong>：轻量 SDD 框架，三阶段状态机（proposal → apply → archive）+ 增量标记（ADDED/MODIFIED/REMOVED），对 brownfield 迭代友好；输出约 250 行，review 成本远低于 GitHub Spec Kit（约 800 行）。与 Claude Code 原生兼容，适合作为本项目&quot;spec 即 agent 上下文&quot;的抓手。\u003c/li>\n\u003c/ul>\n\u003ch3>4.4 Multi-agent / AI 协作治理（新兴领域，资料有限）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>\u003ca href=\"https://code.claude.com/docs/en/agent-teams\">Claude Code Agent Teams\u003c/a>\u003c/strong>（实验性，\u003ccode>CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS\u003c/code>）：lead + 3-5 teammate 的共享 task list 模式，适合 &quot;research + review + cross-layer 改动&quot;。官方三原则：\u003cstrong>最小权限、可逆优先、高风险处人工卡点\u003c/strong>，配合 \u003ccode>--allowedTools\u003c/code> 白名单。\u003c/li>\n\u003cli>\u003cstrong>Commit 归因\u003c/strong>：Claude Code 默认写 \u003ccode>Co-Authored-By: Claude &lt;noreply@anthropic.com&gt;\u003c/code> trailer，GitHub 会展示 co-author。社区有争议（\u003ca href=\"https://bence.ferdinandy.com/2025/12/29/dont-abuse-co-authored-by-for-marking-ai-assistance/\">反对观点\u003c/a>），建议团队统一用专用 \u003ccode>Assisted-By:\u003c/code> 或 \u003ccode>AI-Agent:\u003c/code> trailer + 模型版本，而非复用 \u003ccode>Co-Authored-By\u003c/code>；可借 \u003ca href=\"https://github.com/git-ai-project/git-ai\">git-ai\u003c/a> 类工具。\u003c/li>\n\u003cli>\u003cstrong>Skill / prompt / agent 版本管理\u003c/strong>：参考 \u003cstrong>\u003ca href=\"https://github.com/anthropics/skills\">anthropics/skills\u003c/a>\u003c/strong> 官方仓库约定 —— 每个 skill 一个目录 + \u003ccode>SKILL.md\u003c/code> (YAML frontmatter)。Anthropic 的 **\u003ca href=\"https://tessl.io/blog/anthropic-brings-evals-to-skill-creator-heres-why-thats-a-big-deal/\">skill-creator eval 模式\u003c/a>**把 eval 结果绑到具体版本（v1.1 vs v1.2 盲测 A/B），值得照搬到我们自己的 prompt/agent review 流程。\u003c/li>\n\u003cli>\u003cstrong>未找到权威资料\u003c/strong>：公开的&quot;多人 + 多 agent 在同一仓库的分工冲突解决手册&quot;几乎没有，属于我们可以贡献经验的空白区。\u003c/li>\n\u003c/ul>\n\u003ch3>4.5 对 DeepInsight 的具体建议（尚未纳入我们决策的维度）\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Day 1 就把 Citations API 作为默认后端\u003c/strong>，UI 组件里每一段文字强制可点到原文 span，避免后期翻修。\u003c/li>\n\u003cli>\u003cstrong>建 \u003ccode>evals/\u003c/code> 目录入仓\u003c/strong>，最小化 20 条 golden（含对抗性 PDF prompt injection 样本 3-5 条），CI 拦截 citation 准确率 / injection 成功率回归。\u003c/li>\n\u003cli>\u003cstrong>Prompt/Skill/Agent 都当 code review\u003c/strong>：PR 模板加上&quot;prompt 变更需附 A/B eval diff&quot;一栏，对齐 Anthropic skill-creator 的做法。\u003c/li>\n\u003cli>\u003cstrong>把 &quot;AI 参与度&quot; 做成结构化元数据\u003c/strong>（commit trailer + 自建 \u003ccode>.ai-meta.json\u003c/code>），为团队的治理实验留下可分析的时间序列，而不是自由文本。\u003c/li>\n\u003cli>\u003cstrong>多 agent 并行时启用共享 task list 而非自由分叉\u003c/strong>，并把 &quot;高危操作需人工 approve&quot; 列为不可绕过的 hook，避免 8 人 × N agent 的 race condition。\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch2>5. 体验方式与部署（前期简化版）\u003c/h2>\n\u003cp>\u003cstrong>决策日期：2026-04-23\u003c/strong>\u003c/p>\n\u003cp>前期 MVP 阶段区分\u003cstrong>两个对象\u003c/strong>的部署策略：\u003c/p>\n\u003cp>\u003cstrong>应用本体（\u003ccode>/web\u003c/code>）：纯本地开发，不部署、不做登录。\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>每人 clone 仓库，在自己的 feature 分支上开发\u003c/li>\n\u003cli>\u003ccode>cd web &amp;&amp; npm run dev\u003c/code> 起本地 dev server（\u003ccode>localhost:3000\u003c/code>，Next.js 原生热重载）\u003c/li>\n\u003cli>自己验证 OK → 提 PR → review → 合入 \u003ccode>main\u003c/code>\u003c/li>\n\u003cli>合并后的效果：大家 pull 最新 main 自己本地跑\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>运作看板（\u003ccode>/dashboard\u003c/code>）：走 GitHub Pages（\u003ccode>gh-pages\u003c/code> 分支）。\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>npm run deploy\u003c/code> 自动推送，GitHub Pages 自动发布\u003c/li>\n\u003cli>只读、纯静态、无用户数据、无登录需求（因此没有安全负担）\u003c/li>\n\u003cli>配置细节见 1.6\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>应用本体推迟到后续的事项：\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>统一部署（涉及平台选型：Vercel vs Fly.io）\u003c/li>\n\u003cli>登录 / 权限 / 鉴权\u003c/li>\n\u003cli>PR preview 环境\u003c/li>\n\u003cli>CI/CD 流水线（初期只做本地 lint + typecheck，不设云端 CI 也可先行）\u003c/li>\n\u003cli>团队 billing / 共享 API key\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Anthropic API Key 管理（当前阶段）：\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>每人自己去 \u003ca href=\"https://console.anthropic.com\">console.anthropic.com\u003c/a> 申请个人 API key\u003c/li>\n\u003cli>放在各自本地 \u003ccode>web/.env.local\u003c/code>（\u003cstrong>必须\u003c/strong> \u003ccode>.gitignore\u003c/code>，禁止提交）\u003c/li>\n\u003cli>用自己的 billing，dev 量很小，个人承担\u003c/li>\n\u003cli>团队 workspace + 统一 billing 的方案留到&quot;需要部署预览环境&quot;或&quot;做 eval 消耗大&quot;时再引入\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>澄清（记录给全员）：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Claude Code 订阅（每人各自的）≠ DeepInsight 应用运行时用的 Anthropic API Key（\u003ccode>sk-ant-...\u003c/code>）。前者是大家用的\u003cstrong>开发工具\u003c/strong>，后者是我们要\u003cstrong>构建的 app 内部\u003c/strong>调用 Claude 的凭证，两者账号体系独立。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2>6. 开放问题\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Git 身份处理\u003c/strong>：阿宝自己执行 \u003ccode>git config --global\u003c/code>，还是 Claude 代设？\u003c/li>\n\u003cli>\u003cstrong>第一个垂直切片\u003c/strong>选什么？建议是&quot;上传 PDF → 摘要&quot;最简化路径，你们怎么看？\u003c/li>\n\u003cli>\u003cstrong>CI 提供商\u003c/strong>：GitHub Actions（默认）？要不要同时接本地 pre-commit hook？\u003c/li>\n\u003cli>\u003cstrong>8 人的身份\u003c/strong>：需不需要一份 \u003ccode>docs/guides/TEAM.md\u003c/code> 记录每人背景与关注方向，方便 agent 在评审时引用？\u003c/li>\n\u003cli>\u003cstrong>Skill 与 Subagent 的生命周期治理\u003c/strong>（这是你们明确要探索的点）：\u003cul>\n\u003cli>谁有权 merge 一个新 skill/agent？\u003c/li>\n\u003cli>如何评估 skill 的&quot;质量&quot;？\u003c/li>\n\u003cli>skill 版本怎么管？\u003c/li>\n\u003cli>这块要不要单独写一份 \u003ccode>docs/guides/agent-governance.md\u003c/code> 作为 spec 草稿？\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Eval 体系\u003c/strong>：LLM 输出的质量怎么评估？要不要一开始就引入（哪怕只是简单的 snapshot test）？\u003c/li>\n\u003cli>\u003cstrong>成本观测\u003c/strong>：LLM 调用费用监控从第几轮开始考虑？\u003c/li>\n\u003cli>\u003cstrong>Prompt 管理\u003c/strong>：prompt 和代码的关系（文件内嵌 / 独立 .md / 专用工具）？\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch2>7. 变更日志\u003c/h2>\n\u003cul>\n\u003cli>2026-04-23 初稿（阿宝 + Claude 对话 1~4 轮结果沉淀）\u003c/li>\n\u003cli>2026-04-23 补充第 4 节&quot;业界最佳实践&quot;（agent 联网调研）\u003c/li>\n\u003cli>2026-04-23 新增第 5 节&quot;体验方式与部署（前期简化版）&quot;：确认 MVP 阶段纯本地开发，API key 每人自用，部署/登录/团队 billing 推迟\u003c/li>\n\u003cli>2026-04-23 新增 1.6 &quot;项目运作看板&quot;：markdown 驱动的静态看板 + GitHub Pages；部署\u003cstrong>改用 \u003ccode>gh-pages\u003c/code> 分支\u003c/strong>（避免与 \u003ccode>/docs\u003c/code> 开发文档目录冲突 —— 修正上一轮建议）；目录规范新增 \u003ccode>dashboard/\u003c/code>、\u003ccode>scripts/\u003c/code>、\u003ccode>package.json\u003c/code>；实施步骤重组为 A/B 两条并行线；第 5 节区分&quot;应用本体&quot;与&quot;运作看板&quot;的部署策略\u003c/li>\n\u003cli>2026-04-23 \u003cstrong>完成 A1 治理层\u003c/strong>：\u003ccode>README.md\u003c/code>、\u003ccode>CLAUDE.md\u003c/code>、\u003ccode>docs/specs/TEMPLATE.md\u003c/code>、\u003ccode>docs/guides/CONTRIBUTING.md\u003c/code>、\u003ccode>docs/architecture/adr/0000-record-architecture-decisions.md\u003c/code>、\u003ccode>.github/PULL_REQUEST_TEMPLATE.md\u003c/code> + oks、部署、GitHub Pages 配置、贡献者文档","leverage":["`docs/guides/CONTRIBUTING.md`：分支、PR、review、commit trailer、dev 启动","`dashboard/` 本身的迭代","`.github/workflows/deploy-dashboard.yml` & 未来的 `ci.yml`","本地一键 dev 脚本（如 `npm run setup`）"],"trigger":"PR 改到 `dashboard/**`、`scripts/**`、`.github/**`、`.claude/settings.json`","stage":""}],"stats":{"total":8,"claimed":0,"open":8}},"insights":{"placeholder":false,"welcome":{"path":"README.md","slug":"readme","title":"Insights —— 外部参考与对标","summary":"Insight → Spec → ADR → 代码。从\"别人怎么做\"到\"我们决定怎么做\"到\"我们怎么做的\"。","html":"\u003ch1>Insights —— 外部参考与对标\u003c/h1>\n\u003cblockquote>\n\u003cp>本目录收纳\u003cstrong>对 DeepInsight 有借鉴价值\u003c/strong>的外部资料：业界最佳实践、相关开源项目对标、论文与工程博客摘要。\n不是真源，真源在草稿 / spec / ADR。这里是&quot;外面的人在怎么做，我们挑哪些抄&quot;的笔记本。\u003c/p>\n\u003c/blockquote>\n\u003ch2>目录\u003c/h2>\n\u003cpre>\u003ccode>docs/Insights/\n├── README.md                          # 本文件\n├── 对标分析-OpenClaw-AI-Daily.md       # gitcode.com/ninjaer/AI-Daily-report 对标\n└── 业界最佳实践/\n    ├── README.md                      # 索引\n    ├── 01-anthropic-prompt-caching.md\n    ├── 02-多-agent-协作模式.md\n    ├── 03-spec-driven-development.md\n    ├── 04-pdf-与长文档处理.md\n    ├── 05-structured-output.md\n    └── 06-llm-可观测性与评测.md\n\u003c/code>\u003c/pre>\n\u003ch2>约定\u003c/h2>\n\u003cul>\n\u003cli>每篇独立可读；顶部 200 字内说清\u003cstrong>是什么 / 为什么对 DeepInsight 有用 / 怎么落地\u003c/strong>\u003c/li>\n\u003cli>引用原文\u003cstrong>带链接 + 原文发布日期\u003c/strong>；不引别人还没发布的东西\u003c/li>\n\u003cli>只摘对我们项目\u003cstrong>直接可操作\u003c/strong>的结论，不做综述。综述去看原文\u003c/li>\n\u003cli>如果某条实践被我们采纳并落地成 spec / ADR，在本文件对应条目下加 \u003ccode>→ 已落地：docs/specs/NNN-*.md\u003c/code> 的链接\u003c/li>\n\u003c/ul>\n\u003ch2>和其他目录的关系\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>目录\u003c/th>\n\u003cth>作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>docs/specs/\u003c/code>\u003c/td>\n\u003ctd>我们自己的方案真源（要做什么）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>docs/architecture/adr/\u003c/code>\u003c/td>\n\u003ctd>我们自己的决策记录（为什么这样选）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>\u003ccode>docs/Insights/\u003c/code>\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>外部怎么做的（别人这么选，供我们参考）\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>docs/guides/\u003c/code>\u003c/td>\n\u003ctd>我们自己的流程规范\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Insight → Spec → ADR → 代码。从&quot;别人怎么做&quot;到&quot;我们决定怎么做&quot;到&quot;我们怎么做的&quot;。\u003c/p>\n\u003ch2>维护\u003c/h2>\n\u003cul>\n\u003cli>谁读到有价值的新内容，就加进来（commit 标签 \u003ccode>[human]\u003c/code> 或 \u003ccode>[pair]\u003c/code>）\u003c/li>\n\u003cli>每季度回看一次：过时的标 \u003ccode>deprecated\u003c/code>，已落地的补链接，不再参考的删掉\u003c/li>\n\u003cli>篇幅上限：每篇 ≤ 200 行；超了就拆或做删减\u003c/li>\n\u003c/ul>\n","order":9007199254740991,"updatedAt":"2026-04-25T04:37:31.171Z","githubUrl":"https://github.com/Boris-hbx/DeepInsight/blob/main/docs/Insights/README.md"},"categories":[{"key":"业界最佳实践","label":"业界最佳实践","readme":{"path":"业界最佳实践/README.md","slug":"业界最佳实践-readme","title":"业界最佳实践（Industry Best Practices）","summary":"","html":"\u003ch1>业界最佳实践（Industry Best Practices）\u003c/h1>\n\u003cblockquote>\n\u003cp>对 DeepInsight 直接可操作的业界最佳实践笔记。每篇解决一个具体的工程决策。\n不做综述，只摘能落地的结论。\u003c/p>\n\u003c/blockquote>\n\u003ch2>目录\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>主题\u003c/th>\n\u003cth>一句话\u003c/th>\n\u003cth>主要受益方\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"./01-anthropic-prompt-caching.md\">01\u003c/a>\u003c/td>\n\u003ctd>Prompt Caching\u003c/td>\n\u003ctd>把稳定的长上下文标 \u003ccode>cache_control\u003c/code>，省 90% 成本\u003c/td>\n\u003ctd>Z-3 LLM 调用层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"./02-%E5%A4%9A-agent-%E5%8D%8F%E4%BD%9C%E6%A8%A1%E5%BC%8F.md\">02\u003c/a>\u003c/td>\n\u003ctd>Orchestrator-Worker 多 agent\u003c/td>\n\u003ctd>主 agent 分解任务 + 子 agent 并行，适合长研究类输入\u003c/td>\n\u003ctd>Z-3 LLM 调用层 / Z-7 Agent 协作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"./03-spec-driven-development.md\">03\u003c/a>\u003c/td>\n\u003ctd>Spec-Driven Development\u003c/td>\n\u003ctd>spec-kit 范式，我们的 spec 流程与之一致可加强\u003c/td>\n\u003ctd>Z-7 Agent 协作 / Z-8 DevEx\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"./04-pdf-%E4%B8%8E%E9%95%BF%E6%96%87%E6%A1%A3%E5%A4%84%E7%90%86.md\">04\u003c/a>\u003c/td>\n\u003ctd>PDF 原生传入 + 分块策略\u003c/td>\n\u003ctd>Claude 原生 PDF + 分层分块应对长文\u003c/td>\n\u003ctd>Z-4 数据 pipeline\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"./05-structured-output.md\">05\u003c/a>\u003c/td>\n\u003ctd>Structured Output\u003c/td>\n\u003ctd>\u003ccode>strict: true\u003c/code> 工具调用 / \u003ccode>output_format\u003c/code> 直出 JSON\u003c/td>\n\u003ctd>Z-3 LLM 调用层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"./06-llm-%E5%8F%AF%E8%A7%82%E6%B5%8B%E6%80%A7%E4%B8%8E%E8%AF%84%E6%B5%8B.md\">06\u003c/a>\u003c/td>\n\u003ctd>LLM 可观测性 + Eval 三层\u003c/td>\n\u003ctd>OTel trace + unit eval + LLM-judge + 生产采样\u003c/td>\n\u003ctd>Z-5 运行时保护 / Z-6 测试\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>怎么用\u003c/h2>\n\u003cul>\n\u003cli>做 spec 前扫一眼相关篇，把建议当&quot;默认起点&quot;，不重造\u003c/li>\n\u003cli>守护人（见 \u003ccode>docs/stewardship.md\u003c/code>）定期 review 自己领域对应的篇目，把新实践补进来\u003c/li>\n\u003cli>如果某篇的建议被我们采纳 → 落地成 spec / ADR → 在该篇末尾加&quot;已落地：spec NNN&quot;链接\u003c/li>\n\u003cli>如果发现建议已过时（模型能力提升、API 变更等）→ 标 \u003ccode>deprecated\u003c/code> + 日期 + 新建议\u003c/li>\n\u003c/ul>\n\u003ch2>不要做的事\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>不要直接把这里的内容当规范\u003c/strong>。规范在 \u003ccode>docs/guides/\u003c/code> 和 spec / ADR\u003c/li>\n\u003cli>\u003cstrong>不要引用未发布的能力\u003c/strong>。只摘已 GA / 已上线的东西\u003c/li>\n\u003cli>\u003cstrong>不要把它当教程\u003c/strong>。教程去看原文链接；这里只谈&quot;我们要不要抄、怎么抄&quot;\u003c/li>\n\u003c/ul>\n","order":9007199254740991,"updatedAt":"2026-04-25T04:37:31.171Z","githubUrl":"https://github.com/Boris-hbx/DeepInsight/blob/main/docs/Insights/%E4%B8%9A%E7%95%8C%E6%9C%80%E4%BD%B3%E5%AE%9E%E8%B7%B5/README.md"},"docs":[{"path":"业界最佳实践/01-anthropic-prompt-caching.md","slug":"业界最佳实践-01-anthropic-prompt-caching","title":"01 · Anthropic Prompt Caching","summary":"给 prompt 里稳定不变的段落打 cachecontrol: {type: \"ephemeral\"} 标记；命中缓存时 input token 费用降到基准的 0.1×，latency 降最多 85%。","html":"\u003ch1>01 · Anthropic Prompt Caching\u003c/h1>\n\u003cblockquote>\n\u003cp>\u003cstrong>来源\u003c/strong>：\u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">Anthropic Docs — Prompt caching\u003c/a> / \u003ca href=\"https://www.anthropic.com/news/prompt-caching\">Anthropic News — Prompt caching with Claude\u003c/a>\n\u003cstrong>抓取日期\u003c/strong>：2026-04-24\u003c/p>\n\u003c/blockquote>\n\u003ch2>是什么\u003c/h2>\n\u003cp>给 prompt 里\u003cstrong>稳定不变\u003c/strong>的段落打 \u003ccode>cache_control: {type: &quot;ephemeral&quot;}\u003c/code> 标记；命中缓存时 input token 费用降到基准的 \u003cstrong>0.1×\u003c/strong>，latency 降最多 85%。\u003c/p>\n\u003cp>缓存作用域：tools → system → messages，\u003cstrong>顺序 + 内容完全一致\u003c/strong>才命中（100% 字节级相等）。TTL 默认 5 分钟（可显式写 \u003ccode>ttl: &quot;1h&quot;\u003c/code> 用 1 小时档，写入费用相应上升至 2×）。\u003c/p>\n\u003ch2>为什么对 DeepInsight 有用\u003c/h2>\n\u003cp>DeepInsight 的典型调用结构是：\u003c/p>\n\u003cpre>\u003ccode>[长 system prompt：报告风格 + 输出 schema + few-shot]    ← 不变，应 cache\n[长 document：用户上传的 PDF/论文]                        ← 每次不同\n[短 query：用户的具体问题 / 追问]                          ← 每次不同\n\u003c/code>\u003c/pre>\n\u003cp>一次会话里用户常会对同一份文档\u003cstrong>反复追问\u003c/strong>。不 cache 每次都付全价；cache 上之后追问的增量成本只在&quot;最后一段未缓存内容&quot;。粗估对长文档场景可省 70–90% token。\u003c/p>\n\u003ch2>怎么落地\u003c/h2>\n\u003ch3>Z-3 LLM 调用层的默认写法\u003c/h3>\n\u003cp>在 \u003ccode>web/lib/llm/\u003c/code> 封装一个 \u003ccode>callClaude()\u003c/code>，强制把 \u003ccode>system\u003c/code> 和&quot;已上传文档&quot;段标 cache：\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">// web/lib/llm/client.ts（示意）\nawait client.messages.create({\n  model: &quot;claude-opus-4-7&quot;,\n  system: [\n    {\n      type: &quot;text&quot;,\n      text: SYSTEM_PROMPT,                       // 含 schema + few-shot\n      cache_control: { type: &quot;ephemeral&quot; },      // ← 稳定，cache\n    },\n  ],\n  messages: [\n    {\n      role: &quot;user&quot;,\n      content: [\n        {\n          type: &quot;document&quot;,\n          source: { type: &quot;base64&quot;, media_type: &quot;application/pdf&quot;, data: pdfB64 },\n          cache_control: { type: &quot;ephemeral&quot; },  // ← 本次会话反复用，cache\n        },\n        { type: &quot;text&quot;, text: userQuery },       // ← 每次不同，不 cache\n      ],\n    },\n  ],\n});\n\u003c/code>\u003c/pre>\n\u003ch3>断点放哪\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>tools\u003c/code> 末尾（如果 tools 稳定）\u003c/li>\n\u003cli>\u003ccode>system\u003c/code> 末尾\u003c/li>\n\u003cli>已上传文档段末尾\u003c/li>\n\u003cli>\u003cstrong>不要\u003c/strong>在快速变化的内容前加断点（会稀释命中率）\u003c/li>\n\u003c/ul>\n\u003ch3>监控\u003c/h3>\n\u003cul>\n\u003cli>用 response 里的 \u003ccode>usage.cache_creation_input_tokens\u003c/code> / \u003ccode>usage.cache_read_input_tokens\u003c/code> 分别统计\u003cstrong>写\u003c/strong>和\u003cstrong>读\u003c/strong>\u003c/li>\n\u003cli>按 \u003ccode>user_id / feature / prompt_version\u003c/code> 打 tag（和 Z-5 观测 checklist 对齐）\u003c/li>\n\u003cli>命中率 &lt; 50% 触发告警：多半是 system prompt 里混进了动态内容（当前日期 / user_id 串拼进去了），要挪出来\u003c/li>\n\u003c/ul>\n\u003ch2>常见坑\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>把 \u003ccode>Date.now()\u003c/code> 或用户 id 拼进 system\u003c/strong> → 每次都 miss。所有动态值放到 messages 里\u003c/li>\n\u003cli>\u003cstrong>1h TTL 不是万能药\u003c/strong>：写入成本 2×，只有确认高频重用才开；一次性调用反而亏\u003c/li>\n\u003cli>\u003cstrong>2026-02 起按 workspace 隔离缓存\u003c/strong>：多 workspace 的组织要留意命中边界\u003c/li>\n\u003cli>\u003cstrong>5 分钟 TTL 是默认\u003c/strong>：用户追问间隔若经常 &gt; 5min，要么 extend 到 1h，要么接受 miss 率\u003c/li>\n\u003c/ol>\n\u003ch2>行动建议\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Z-3 守护人：在 \u003ccode>web/lib/llm/\u003c/code> 提供统一的 \u003ccode>callClaude()\u003c/code>，\u003cstrong>默认\u003c/strong>给 system + document 段打 cache\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Z-5 守护人：把 \u003ccode>cache_read_tokens / cache_write_tokens\u003c/code> 加到观测 dashboard\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> spec 模板「成本 checklist」加一条：&quot;prompt 里哪些段标了 cache_control？命中率目标是多少？&quot;\u003c/li>\n\u003c/ul>\n\u003ch2>参考\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">Anthropic — Prompt caching docs\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://dev.to/whoffagents/claude-prompt-caching-in-2026-the-5-minute-ttl-change-thats-costing-you-money-4363\">DEV — Claude Prompt Caching in 2026: The 5-Minute TTL Change\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://www.claudecodecamp.com/p/how-prompt-caching-actually-works-in-claude-code\">Claude Code Camp — How prompt caching actually works in Claude Code\u003c/a>\u003c/li>\n\u003c/ul>\n","order":1,"updatedAt":"2026-04-25T04:37:31.171Z","githubUrl":"https://github.com/Boris-hbx/DeepInsight/blob/main/docs/Insights/%E4%B8%9A%E7%95%8C%E6%9C%80%E4%BD%B3%E5%AE%9E%E8%B7%B5/01-anthropic-prompt-caching.md"},{"path":"业界最佳实践/02-多-agent-协作模式.md","slug":"业界最佳实践-02-多-agent-协作模式","title":"02 · Orchestrator-Worker 多 agent 模式","summary":"Anthropic 的 Research 功能用 lead agent + 并行 subagent 架构： - Lead (orchestrator)：分析用户问题 → 产出研究计划 → 把计划存到 Memory（避免 200k 上下文被截断时丢失） → 分发子任务 - Subagent (worker)：拿到明确的…","html":"\u003ch1>02 · Orchestrator-Worker 多 agent 模式\u003c/h1>\n\u003cblockquote>\n\u003cp>\u003cstrong>来源\u003c/strong>：\u003ca href=\"https://www.anthropic.com/engineering/multi-agent-research-system\">Anthropic Engineering — How we built our multi-agent research system\u003c/a> / \u003ca href=\"https://www.anthropic.com/research/building-effective-agents\">Anthropic — Building effective agents\u003c/a>\n\u003cstrong>抓取日期\u003c/strong>：2026-04-24\u003c/p>\n\u003c/blockquote>\n\u003ch2>是什么\u003c/h2>\n\u003cp>Anthropic 的 Research 功能用 \u003cstrong>lead agent + 并行 subagent\u003c/strong> 架构：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Lead (orchestrator)\u003c/strong>：分析用户问题 → 产出研究计划 → 把计划存到 Memory（避免 200k 上下文被截断时丢失） → 分发子任务\u003c/li>\n\u003cli>\u003cstrong>Subagent (worker)\u003c/strong>：拿到明确的\u003cstrong>目标 / 输出格式 / 可用工具 / 任务边界\u003c/strong>，在自己独立的上下文里并行执行 → 返回结构化结果\u003c/li>\n\u003cli>\u003cstrong>Lead\u003c/strong>：汇总、判断是否需要再派、产出终稿\u003c/li>\n\u003c/ul>\n\u003cp>Claude Opus 4 做 lead + Sonnet 4 做 subagent 的组合，\u003cstrong>比单 Opus 4 强 90.2%\u003c/strong>（Anthropic 内部 eval）。\u003c/p>\n\u003ch2>代价\u003c/h2>\n\u003cblockquote>\n\u003cp>\u003cstrong>多 agent 系统 token 消耗约为单轮对话的 15×\u003c/strong>。只在&quot;产出价值远大于 token 成本&quot;的任务上用。\u003c/p>\n\u003c/blockquote>\n\u003ch2>为什么对 DeepInsight 有用\u003c/h2>\n\u003cp>DeepInsight 的&quot;洞察报告&quot;场景天然就是个研究任务：\u003c/p>\n\u003cul>\n\u003cli>一篇 30 页论文 + 2 篇相关博客 + 用户的 3 个具体关注点 → 要并行抽取、交叉验证、归纳结构\u003c/li>\n\u003cli>上下文容易爆：输入拼起来可能 &gt; 200k\u003c/li>\n\u003cli>每一步性质不同：解析重召回 / 抽取重 grounding / 综合重连贯\u003c/li>\n\u003c/ul>\n\u003cp>映射到我们的 pipeline：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>角色\u003c/th>\n\u003cth>在 DeepInsight 的对应\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Lead (Opus)\u003c/td>\n\u003ctd>主 agent：规划报告大纲、决定需要哪些提取任务、最终组装\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Subagent A (Sonnet)\u003c/td>\n\u003ctd>解析器：PDF → 结构化 chunks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Subagent B (Sonnet)\u003c/td>\n\u003ctd>抽取器：按大纲的每个子主题独立并行抽 claim + citation\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Subagent C (Sonnet)\u003c/td>\n\u003ctd>校验器：对 claim 做 grounding check，标不确定度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lead 回收\u003c/td>\n\u003ctd>按模板合成最终报告\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>怎么落地\u003c/h2>\n\u003ch3>什么时候启用多 agent（否则就单 agent）\u003c/h3>\n\u003cul>\n\u003cli>输入总 token &gt; 150k\u003c/li>\n\u003cli>用户明确要&quot;多源综述 / 综合分析&quot;\u003c/li>\n\u003cli>报告大纲包含 ≥ 4 个独立子主题\u003c/li>\n\u003cli>预估产出价值高（用户愿意等 30s+ / 付更高成本）\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>MVP 阶段默认单 agent\u003c/strong>；多 agent 写在 spec 里当 feature flag 灰度。\u003c/p>\n\u003ch3>每个 subagent 的 prompt 必含 4 项\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Objective\u003c/strong>：一句话讲清楚这个 subagent 要产出什么\u003c/li>\n\u003cli>\u003cstrong>Output format\u003c/strong>：强制 JSON schema（见 \u003ccode>05-structured-output.md\u003c/code>）\u003c/li>\n\u003cli>\u003cstrong>Tools &amp; sources\u003c/strong>：允许用哪些工具 / 引用哪些文档段（不要让它自由发挥）\u003c/li>\n\u003cli>\u003cstrong>Task boundary\u003c/strong>：明确\u003cstrong>不做\u003c/strong>什么，避免重叠（子任务重叠 = 双倍 token，结果还可能冲突）\u003c/li>\n\u003c/ol>\n\u003ch3>Memory 落地\u003c/h3>\n\u003cp>Lead 的研究计划\u003cstrong>必须持久化\u003c/strong>到 Memory 文件或外部存储，不能只放在 context 里：\u003c/p>\n\u003cul>\n\u003cli>本地 MVP：写到 \u003ccode>web/.tmp/plans/&lt;session-id&gt;.json\u003c/code>\u003c/li>\n\u003cli>生产：对象存储 / DB\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>原因：上下文窗口虽然有 1M，但 lead agent 跑到后期 context 会膨胀，\u003cstrong>计划本身是最值得保护的状态\u003c/strong>。\u003c/p>\n\u003c/blockquote>\n\u003ch2>和我们已有设计的连接\u003c/h2>\n\u003cul>\n\u003cli>章程 § 4.1 已提&quot;map-reduce + 1M token fallback&quot;，本范式是其\u003cstrong>升级版\u003c/strong>（map 并行 + reduce 集中）\u003c/li>\n\u003cli>\u003ccode>docs/stewardship.md\u003c/code> Z-7 守护人覆盖&quot;subagent 注册表&quot;，这里的 orchestrator-worker 模式可作为注册表的一个 entry\u003c/li>\n\u003cli>\u003ccode>docs/specs/TEMPLATE.md\u003c/code> § 7「Agent 参与度」的&quot;会用 subagent 的子任务&quot;栏，就是填本模式的位置\u003c/li>\n\u003c/ul>\n\u003ch2>常见坑\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>过度使用\u003c/strong>：简单输入用多 agent 是烧钱。加启用门槛\u003c/li>\n\u003cli>\u003cstrong>subagent 任务边界模糊\u003c/strong>：导致 subagent 之间大量重叠计算。\u003cstrong>每个 subagent 的 objective 必须互斥\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>lead 忘了存 plan\u003c/strong>：上下文快满时 lead 开始遗忘，产出跑偏\u003c/li>\n\u003cli>\u003cstrong>subagent 并行写同一输出槽\u003c/strong>：要求每个 subagent 返回独立 namespace 的结果，lead 负责合并\u003c/li>\n\u003c/ol>\n\u003ch2>行动建议\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Z-3 守护人：在 \u003ccode>web/lib/llm/orchestrator/\u003c/code> 预留目录骨架 + 接口定义（不急着实现）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 等 MVP 单 agent 跑稳后开 spec \u003ccode>spec/xxx/multi-agent-research\u003c/code>，先做一个子主题的 POC\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Eval 时\u003cstrong>一定\u003c/strong>同时测单 agent 版本做对照组，别被&quot;多 agent 看起来 fancy&quot;骗\u003c/li>\n\u003c/ul>\n\u003ch2>参考\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://www.anthropic.com/engineering/multi-agent-research-system\">Anthropic Engineering — How we built our multi-agent research system\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://www.anthropic.com/research/building-effective-agents\">Anthropic — Building effective agents\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://blog.bytebytego.com/p/how-anthropic-built-a-multi-agent\">ByteByteGo — How Anthropic built a multi-agent research system\u003c/a>\u003c/li>\n\u003c/ul>\n","order":2,"updatedAt":"2026-04-25T04:37:31.171Z","githubUrl":"https://github.com/Boris-hbx/DeepInsight/blob/main/docs/Insights/%E4%B8%9A%E7%95%8C%E6%9C%80%E4%BD%B3%E5%AE%9E%E8%B7%B5/02-%E5%A4%9A-agent-%E5%8D%8F%E4%BD%9C%E6%A8%A1%E5%BC%8F.md"},{"path":"业界最佳实践/03-spec-driven-development.md","slug":"业界最佳实践-03-spec-driven-development","title":"03 · Spec-Driven Development（SDD）","summary":"GitHub 的 spec-kit 把它工具化：一个 CLI 为 Copilot / Claude Code / Gemini CLI 创建 workspace，内含： - constitution：项目级不可变原则（相当于我们的 CLAUDE.md + 章程 § 核心约定） - spec：每个特性的规格，含行为 /…","html":"\u003ch1>03 · Spec-Driven Development（SDD）\u003c/h1>\n\u003cblockquote>\n\u003cp>\u003cstrong>来源\u003c/strong>：\u003ca href=\"https://github.blog/ai-and-ml/generative-ai/spec-driven-development-with-ai-get-started-with-a-new-open-source-toolkit/\">GitHub Blog — Spec-driven development with AI\u003c/a> / \u003ca href=\"https://github.com/github/spec-kit\">github/spec-kit\u003c/a> / \u003ca href=\"https://martinfowler.com/articles/exploring-gen-ai/sdd-3-tools.html\">Martin Fowler — Exploring Gen AI: SDD tools\u003c/a>\n\u003cstrong>抓取日期\u003c/strong>：2026-04-24\u003c/p>\n\u003c/blockquote>\n\u003ch2>是什么\u003c/h2>\n\u003cblockquote>\n\u003cp>Spec-Driven Development：\u003cstrong>先写 spec，后写代码\u003c/strong>。spec 是人与 agent 的共同真源，代码 / 测试 / 文档都从 spec 派生。\u003c/p>\n\u003c/blockquote>\n\u003cp>GitHub 的 spec-kit 把它工具化：一个 CLI 为 Copilot / Claude Code / Gemini CLI 创建 workspace，内含：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>constitution\u003c/strong>：项目级不可变原则（相当于我们的 CLAUDE.md + 章程 § 核心约定）\u003c/li>\n\u003cli>\u003cstrong>spec\u003c/strong>：每个特性的规格，含行为 / 约束 / 接口 / 需求\u003c/li>\n\u003cli>workflow：spec → 评审 → agent 实现 → 测试\u003c/li>\n\u003c/ul>\n\u003cp>思想不新（Amazon 6-pager、Kiro IDE 都是变体），新在&quot;\u003cstrong>agent 时代，spec 是人机共享的 interface\u003c/strong>&quot;。Agent 不会瞎猜意图，人审 spec 比审 diff 效率高得多。\u003c/p>\n\u003ch2>为什么对 DeepInsight 有用\u003c/h2>\n\u003cp>我们\u003cstrong>已经在做\u003c/strong>（章程 § 确立了&quot;每个 PR 关联一个 spec&quot;的流程）。这篇不是告诉我们&quot;要不要做&quot;，而是对照业界成熟方案查漏补缺。\u003c/p>\n\u003ch3>我们已有的对应项\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>SDD 要素\u003c/th>\n\u003cth>DeepInsight 当前\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Constitution\u003c/td>\n\u003ctd>\u003ccode>CLAUDE.md\u003c/code> + \u003ccode>项目章程.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Spec 模板\u003c/td>\n\u003ctd>\u003ccode>docs/specs/TEMPLATE.md\u003c/code>（含 9 个必填章节）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>评审流程\u003c/td>\n\u003ctd>\u003ccode>docs/guides/CONTRIBUTING.md\u003c/code> § 3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent 输入\u003c/td>\n\u003ctd>\u003ccode>.claude/skills/\u003c/code> + \u003ccode>.claude/agents/\u003c/code>（Z-7 守护）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>决策记录\u003c/td>\n\u003ctd>\u003ccode>docs/architecture/adr/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>我们可以加强的点\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>把 constitution 显式化\u003c/strong>：目前 CLAUDE.md + 草稿分散了&quot;不可变原则&quot;。\u003cstrong>动作\u003c/strong>：在 CLAUDE.md 顶部加一个&quot;红线（不可变）&quot;章节，列 5–10 条真的绝不妥协的事（如&quot;API key 严禁提交&quot;、&quot;\u003ccode>main\u003c/code> 禁止直推&quot;、&quot;不伪造数据&quot;）。\u003c/li>\n\u003cli>\u003cstrong>Spec 模板加「验收场景」栏\u003c/strong>：spec-kit 的 spec 要包含 Given/When/Then 的可执行场景。我们模板的 § 6「验收标准」太抽象，可细化为&quot;场景表&quot;。\u003c/li>\n\u003cli>\u003cstrong>Spec → test 的直接派生\u003c/strong>：spec-kit 鼓励 agent 从 spec 自动派生单测骨架。我们可以在 \u003ccode>.claude/skills/spec-to-tests.md\u003c/code> 里固化这个流程。\u003c/li>\n\u003cli>\u003cstrong>Spec 版本化\u003c/strong>：spec 合并后不是冻结，而是跟随实现演进。每次变更加 \u003ccode>## Changelog\u003c/code> 条目（我们模板已有，关键是\u003cstrong>强制真写\u003c/strong>，不流于形式）。\u003c/li>\n\u003c/ol>\n\u003ch2>怎么落地（不大改的微调）\u003c/h2>\n\u003ch3>短平快（本周）\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 在 \u003ccode>CLAUDE.md\u003c/code> 顶部加 10 行以内的「红线」节选\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 在 \u003ccode>docs/specs/TEMPLATE.md\u003c/code> § 6 下加「6.1 验收场景（Given/When/Then）」小节\u003c/li>\n\u003c/ul>\n\u003ch3>中期（MVP 之后）\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>.claude/skills/spec-to-tests.md\u003c/code>：输入 spec → 产出 test skeleton\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>.claude/skills/spec-lint.md\u003c/code>：检查 spec 是否每个 checklist 都非 N/A、changelog 是否更新\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> spec 评审阶段增加&quot;agent 自读&quot;步骤：让 agent 列出它从 spec 推出的 3 个不确定点，作者必答\u003c/li>\n\u003c/ul>\n\u003ch3>不要做\u003c/h3>\n\u003cul>\n\u003cli>不要引入 spec-kit CLI 本身。我们的流程已经比它轻 &amp; 对 Claude Code 更贴，强加 CLI 只会徒增依赖。\u003c/li>\n\u003cli>不要把 spec 变成设计文档大全。保持模板目前的篇幅上限（~2 页）。\u003c/li>\n\u003c/ul>\n\u003ch2>反模式警示\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Spec 写得太详细 → 变成&quot;低效的代码&quot;\u003c/strong>：描述该做什么，而不是怎么做。怎么做属于实现。\u003c/li>\n\u003cli>\u003cstrong>Spec 写得太空 → agent 自由发挥\u003c/strong>：每个必填栏要真填，&quot;N/A&quot;要带原因一行。\u003c/li>\n\u003cli>\u003cstrong>Spec 和代码脱节\u003c/strong>：合并后代码改了但 spec 没同步。建议：PR 模板加一句&quot;本 PR 对 spec 的影响是？&quot;（即使是 no-op 也要显式写 no-op）\u003c/li>\n\u003c/ul>\n\u003ch2>参考\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://github.com/github/spec-kit\">github/spec-kit\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.blog/ai-and-ml/generative-ai/spec-driven-development-with-ai-get-started-with-a-new-open-source-toolkit/\">GitHub Blog — Spec-driven development with AI\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://martinfowler.com/articles/exploring-gen-ai/sdd-3-tools.html\">Martin Fowler — Understanding Spec-Driven Development: Kiro, spec-kit, and Tessl\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://developer.microsoft.com/blog/spec-driven-development-spec-kit\">Microsoft Dev Blog — Diving into Spec-Driven Development with GitHub Spec Kit\u003c/a>\u003c/li>\n\u003c/ul>\n","order":3,"updatedAt":"2026-04-25T04:37:31.171Z","githubUrl":"https://github.com/Boris-hbx/DeepInsight/blob/main/docs/Insights/%E4%B8%9A%E7%95%8C%E6%9C%80%E4%BD%B3%E5%AE%9E%E8%B7%B5/03-spec-driven-development.md"},{"path":"业界最佳实践/04-pdf-与长文档处理.md","slug":"业界最佳实践-04-pdf-与长文档处理","title":"04 · PDF 与长文档处理","summary":"DeepInsight 核心输入就是 PDF（论文 / 白皮书 / 行业报告）。选型直接决定： - 能不能准确引用（citation 落到具体页 / 具体表格） - 能不能分析图表和公式（如果先转 TXT，图就没了） - 成本（按页扣 token，长 PDF 费钱）","html":"\u003ch1>04 · PDF 与长文档处理\u003c/h1>\n\u003cblockquote>\n\u003cp>\u003cstrong>来源\u003c/strong>：\u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/pdf-support\">Anthropic Docs — PDF support\u003c/a> / \u003ca href=\"https://github.com/anthropics/anthropic-cookbook/blob/main/misc/pdf_upload_summarization.ipynb\">Anthropic Cookbook — pdf_upload_summarization\u003c/a> / \u003ca href=\"https://docs.together.ai/docs/how-to-implement-contextual-rag-from-anthropic\">Together AI — Contextual RAG from Anthropic\u003c/a>\n\u003cstrong>抓取日期\u003c/strong>：2026-04-24\u003c/p>\n\u003c/blockquote>\n\u003ch2>Claude 原生 PDF 能力（2025-02 后 GA）\u003c/h2>\n\u003cul>\n\u003cli>三种传入方式：\u003cstrong>URL / base64 / Files API\u003c/strong>（Files API 推荐，payload 小，支持 \u003ccode>file_id\u003c/code> 复用）\u003c/li>\n\u003cli>Claude 内部把每页\u003cstrong>同时\u003c/strong>栅格化为图 + 抽取文本，多模态处理表格 / 图 / 公式 / 图表\u003c/li>\n\u003cli>最适合：有图表 / 公式 / 表格 / 多栏版式的科研论文和技术白皮书 —— \u003cstrong>不要\u003c/strong>先 PDF→TXT 再喂，会丢视觉信息\u003c/li>\n\u003c/ul>\n\u003ch2>为什么对 DeepInsight 有用\u003c/h2>\n\u003cp>DeepInsight 核心输入就是 PDF（论文 / 白皮书 / 行业报告）。选型直接决定：\u003c/p>\n\u003cul>\n\u003cli>能不能准确引用（citation 落到具体页 / 具体表格）\u003c/li>\n\u003cli>能不能分析图表和公式（如果先转 TXT，图就没了）\u003c/li>\n\u003cli>成本（按页扣 token，长 PDF 费钱）\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>默认决策：走 Anthropic 原生 PDF + Files API\u003c/strong>。传统 PDF 解析（pdf-parse / unpdf）只在&quot;用户上传的是纯文本 PDF 且没有图表&quot;时当 fallback。\u003c/p>\n\u003ch2>上下文爆时的分层策略\u003c/h2>\n\u003cp>Claude 上下文 200k（Opus 4.7 可 1M）。真实报告综述场景常超限 → 需要 map-reduce 或 hierarchical：\u003c/p>\n\u003cpre>\u003ccode>       ┌────────── 完整 PDF（可能 300+ 页） ──────────┐\n       │                                                │\n  ┌────┴────┐   ┌──────┐   ┌──────┐   ┌──────┐\n  │ section │   │ sec  │   │ sec  │   │ sec  │       ← map: 按 section 并行\n  │   1     │   │  2   │   │  3   │   │  ... │\n  └────┬────┘   └───┬──┘   └───┬──┘   └───┬──┘\n       │            │          │          │\n       └────── 每 section 抽 claims + citation ────────┐\n                                                        │\n                                                        ▼\n                                       ┌──── reduce 层 ────┐\n                                       │ 合成大纲 + 报告   │\n                                       └───────────────────┘\n\u003c/code>\u003c/pre>\n\u003ch3>实操要点\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>分块优先按\u003c/strong>&quot;文档自带结构（章 / 节 / 标题）&quot;\u003cstrong>分\u003c/strong>，别上来就固定 size chunk。结构化分块召回明显高\u003c/li>\n\u003cli>\u003cstrong>Anthropic Contextual Retrieval\u003c/strong> 对我们场景有用但不是银弹：给每个 chunk 前置一句&quot;本段所在章节 + 与前后关系&quot;，召回可提升，但\u003cstrong>需多一次 LLM 调用\u003c/strong>。论文结构清晰时收益不大；技术博客 / 行业报告用户上传可以用\u003c/li>\n\u003cli>\u003cstrong>Citation 对齐\u003c/strong>：map 阶段每个 claim \u003cstrong>必须带 \u003ccode>{page, offset}\u003c/code> 或 section id\u003c/strong>，reduce 阶段不允许引无锚点的 claim。这条是 Z-6 Eval 的硬指标\u003c/li>\n\u003cli>\u003cstrong>PNG 优于 JPEG\u003c/strong>：如需栅格化特定页（比如只处理一页表格），无损渲染保留网格线和一像素 tick —— 对表格提取关键\u003c/li>\n\u003cli>\u003cstrong>文档 hash 缓存\u003c/strong>：用户反复追问同一份文档，用 hash 做 key 缓存 Files API 的 \u003ccode>file_id\u003c/code> + parse 结果，不要每次重传\u003c/li>\n\u003c/ol>\n\u003ch2>和我们已有设计的连接\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>docs/stewardship.md\u003c/code> Z-4 覆盖&quot;PDF 解析（pdf-parse/unpdf/Files API 选型）&quot;，\u003cstrong>推荐 ADR 结论：Files API 为主\u003c/strong>\u003c/li>\n\u003cli>章程 § 4.1 提的 Citations API 搭配本实践：Files API 负责输入侧，Citations API 负责输出侧引证\u003c/li>\n\u003cli>和 \u003ccode>02-多-agent-协作模式.md\u003c/code> 的 map-reduce 同构：subagent 跑 map，lead 跑 reduce\u003c/li>\n\u003c/ul>\n\u003ch2>常见坑\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>不要自己先 PDF→TXT 再喂\u003c/strong>：丢图 / 丢表 / 丢公式。只有在用户明确&quot;纯文本 PDF&quot;时再降级\u003c/li>\n\u003cli>\u003cstrong>大 PDF 整份 base64 塞 messages\u003c/strong>：payload 臃肿 + 重复传。改 Files API\u003c/li>\n\u003cli>\u003cstrong>草书 / 手写体\u003c/strong>：Claude 提示不保证能读。上传时检测并在 UI 明示\u003c/li>\n\u003cli>\u003cstrong>按 size 一刀切分块\u003c/strong>：切到表格中间 / 切到公式中间，后续引用无从恢复。按结构切\u003c/li>\n\u003c/ol>\n\u003ch2>行动建议\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Z-4 守护人：开 ADR \u003ccode>adr-00XX-pdf-input-strategy.md\u003c/code>，结论 = 原生 Files API + 结构化分块\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Z-4 守护人：出一个最小 \u003ccode>web/lib/pipeline/pdf.ts\u003c/code>，封装 \u003ccode>upload → file_id → cache\u003c/code> 三件套\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Z-6 守护人：把 &quot;citation 必带 {page/section}&quot; 列入 eval 硬指标\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> spec 模板「测试 checklist」加一条：长文档（&gt; 50 页）样本必测\u003c/li>\n\u003c/ul>\n\u003ch2>参考\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/pdf-support\">Anthropic Docs — PDF support\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/anthropics/anthropic-cookbook/blob/main/misc/pdf_upload_summarization.ipynb\">Anthropic Cookbook — PDF upload and summarization\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://www.anthropic.com/news/contextual-retrieval\">Anthropic — Contextual Retrieval\u003c/a>（原文链接，配合上文 Together AI 实现）\u003c/li>\n\u003cli>\u003ca href=\"https://weaviate.io/blog/chunking-strategies-for-rag\">Weaviate — Chunking strategies for RAG\u003c/a>\u003c/li>\n\u003c/ul>\n","order":4,"updatedAt":"2026-04-25T04:37:31.171Z","githubUrl":"https://github.com/Boris-hbx/DeepInsight/blob/main/docs/Insights/%E4%B8%9A%E7%95%8C%E6%9C%80%E4%BD%B3%E5%AE%9E%E8%B7%B5/04-pdf-%E4%B8%8E%E9%95%BF%E6%96%87%E6%A1%A3%E5%A4%84%E7%90%86.md"},{"path":"业界最佳实践/05-structured-output.md","slug":"业界最佳实践-05-structured-output","title":"05 · Structured Output（结构化输出）","summary":"Claude 现在有两种\"强制输出匹配 schema\"的官方手段：","html":"\u003ch1>05 · Structured Output（结构化输出）\u003c/h1>\n\u003cblockquote>\n\u003cp>\u003cstrong>来源\u003c/strong>：\u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/structured-outputs\">Anthropic Docs — Structured outputs\u003c/a> / \u003ca href=\"https://github.com/anthropics/anthropic-cookbook/blob/main/tool_use/extracting_structured_json.ipynb\">Anthropic Cookbook — Extracting structured JSON\u003c/a>\n\u003cstrong>抓取日期\u003c/strong>：2026-04-24\u003c/p>\n\u003c/blockquote>\n\u003ch2>是什么\u003c/h2>\n\u003cp>Claude 现在有两种&quot;强制输出匹配 schema&quot;的官方手段：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>JSON output mode\u003c/strong>：\u003ccode>output_format\u003c/code> 参数，返回严格匹配 schema 的 JSON 落在 \u003ccode>response.content[0].text\u003c/code>。适合数据抽取 / 报告结构生成\u003c/li>\n\u003cli>\u003cstrong>Strict tool use\u003c/strong>：工具定义加 \u003ccode>strict: true\u003c/code>，Claude 调用工具时参数\u003cstrong>严格\u003c/strong>匹配 \u003ccode>input_schema\u003c/code>\u003c/li>\n\u003c/ol>\n\u003cp>两者底层机制一致：\u003cstrong>把 JSON schema 编译成语法，在采样阶段限制 token 生成\u003c/strong>。不是 prompt &quot;请输出 JSON&quot;这种软约束，是硬约束。\u003c/p>\n\u003cp>支持模型：Opus 4.7 / 4.6 / 4.5、Sonnet 4.6 / 4.5、Haiku 4.5 等。\u003c/p>\n\u003ch2>为什么对 DeepInsight 至关重要\u003c/h2>\n\u003cp>报告生成的\u003cstrong>每一步输出都应是结构化数据，不是自由文本\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>解析阶段 → \u003ccode>Chunk[]\u003c/code>（含 section_id、page、text、type）\u003c/li>\n\u003cli>抽取阶段 → \u003ccode>Claim[]\u003c/code>（含 text、citation、confidence）\u003c/li>\n\u003cli>综合阶段 → \u003ccode>Report\u003c/code>（含 sections、claims、sources、locale）\u003c/li>\n\u003cli>渲染阶段 → 前端按 \u003ccode>Report\u003c/code> schema 渲染成 UI\u003c/li>\n\u003c/ul>\n\u003cp>没有结构化约束：\u003c/p>\n\u003cul>\n\u003cli>轻则偶发 JSON 不合法 → 前端崩\u003c/li>\n\u003cli>重则 schema 漂移 → UI 和后端对不上 → 回归\u003c/li>\n\u003cli>更重要：\u003cstrong>没 schema 就没 eval\u003c/strong>。eval 的基础是能逐字段比对 golden\u003c/li>\n\u003c/ul>\n\u003ch2>两条路线怎么选\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>推荐路线\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>最终产出 = 一份结构化报告\u003c/td>\n\u003ctd>\u003cstrong>JSON output mode\u003c/strong>（\u003ccode>output_format\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>agent 中间调工具做事（搜索 / 读库）\u003c/td>\n\u003ctd>\u003cstrong>Strict tool use\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>既要工具调用又要结构化产出\u003c/td>\n\u003ctd>工具 strict + 最后一步 output_format\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>怎么落地\u003c/h2>\n\u003ch3>Report schema 先行\u003c/h3>\n\u003cp>在 \u003ccode>web/lib/llm/schemas/\u003c/code> 用 zod（或等价）定义\u003cstrong>所有\u003c/strong>结构化输出：\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">// web/lib/llm/schemas/report.ts（示意）\nexport const CitationSchema = z.object({\n  document_id: z.string(),\n  page: z.number().int().positive().optional(),\n  section_id: z.string().optional(),\n  quote: z.string(),                   // 原文抄录，作为 grounding 证据\n});\n\nexport const ClaimSchema = z.object({\n  text: z.string(),\n  confidence: z.enum([&quot;high&quot;, &quot;medium&quot;, &quot;low&quot;]),\n  citations: z.array(CitationSchema).min(1),  // 强制至少 1 条引证\n});\n\nexport const ReportSchema = z.object({\n  locale: z.enum([&quot;zh-CN&quot;, &quot;en-US&quot;]),\n  title: z.string(),\n  sections: z.array(z.object({\n    heading: z.string(),\n    claims: z.array(ClaimSchema),\n  })),\n  sources: z.array(z.object({ id: z.string(), type: z.enum([&quot;pdf&quot;, &quot;url&quot;]), title: z.string() })),\n});\n\u003c/code>\u003c/pre>\n\u003cp>zod → JSON schema → 传给 Claude 的 \u003ccode>output_format.schema\u003c/code>。\u003cstrong>一个源头，多处使用\u003c/strong>（API 约束 + 前端 props 类型 + eval 比对）。\u003c/p>\n\u003ch3>必含字段\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Claim 必带 ≥ 1 条 citation + quote\u003c/strong>：这是反幻觉的硬门槛。quote 是原文抄录（非改写），用于 grounding 自动校验\u003c/li>\n\u003cli>\u003cstrong>confidence 枚举\u003c/strong>：模型自报不确定度，下游可视化时标灰\u003c/li>\n\u003cli>\u003cstrong>locale\u003c/strong>：预留国际化\u003c/li>\n\u003c/ul>\n\u003ch3>监控\u003c/h3>\n\u003cul>\n\u003cli>监 \u003ccode>stop_reason\u003c/code>：出现 \u003ccode>max_tokens\u003c/code> / \u003ccode>refusal\u003c/code> 占比突增 → schema 可能过严或 prompt 有问题\u003c/li>\n\u003cli>监\u003cstrong>字段空值率\u003c/strong>：比如 \u003ccode>citations\u003c/code> 为空占比 &gt; 0.1% 就告警 → 回溯到模型抄近路绕 grounding\u003c/li>\n\u003c/ul>\n\u003ch2>反模式\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>prompt 里写&quot;请输出 JSON&quot;但不开 structured output\u003c/strong>：仍会偶发坏 JSON。用硬约束\u003c/li>\n\u003cli>\u003cstrong>schema 放得太宽\u003c/strong>（用 \u003ccode>string\u003c/code> / \u003ccode>any\u003c/code>）：约束失效。\u003cstrong>每个字段都尽量窄\u003c/strong>（enum / 整数范围 / 正则）\u003c/li>\n\u003cli>\u003cstrong>schema 和前端 props 各写一份\u003c/strong>：必漂移。一个源头（zod），前后端共享\u003c/li>\n\u003cli>\u003cstrong>allow \u003ccode>additionalProperties: true\u003c/code>\u003c/strong>：模型会塞&quot;创造&quot;字段，后续跑 eval 噪声大。默认关掉\u003c/li>\n\u003c/ol>\n\u003ch2>和其他最佳实践的连接\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>04-pdf-与长文档处理.md\u003c/code> 的 citation 硬要求 ← 在这里落地为 schema \u003ccode>min(1)\u003c/code> 约束\u003c/li>\n\u003cli>\u003ccode>06-llm-可观测性与评测.md\u003c/code> 的 eval 可逐字段比对 ← 基于本 schema\u003c/li>\n\u003cli>\u003ccode>02-多-agent-协作模式.md\u003c/code> 的 subagent 输出边界 ← 每个 subagent 有独立子 schema\u003c/li>\n\u003c/ul>\n\u003ch2>行动建议\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Z-3 守护人：先定 \u003ccode>Report\u003c/code> + \u003ccode>Claim\u003c/code> + \u003ccode>Citation\u003c/code> 三个 schema，放 \u003ccode>web/lib/llm/schemas/\u003c/code>\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 同步在 \u003ccode>docs/architecture/data-model.md\u003c/code> 落一份人类可读版本\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> MVP 第一个 Claude 调用就必须走 output_format，不走&quot;prompt 求 JSON&quot;\u003c/li>\n\u003c/ul>\n\u003ch2>参考\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/structured-outputs\">Anthropic Docs — Structured outputs\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/anthropics/anthropic-cookbook/blob/main/tool_use/extracting_structured_json.ipynb\">Anthropic Cookbook — Extracting structured JSON\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://thomas-wiegold.com/blog/claude-api-structured-output/\">Thomas Wiegold — Claude API structured output complete guide\u003c/a>\u003c/li>\n\u003c/ul>\n","order":5,"updatedAt":"2026-04-25T04:37:31.171Z","githubUrl":"https://github.com/Boris-hbx/DeepInsight/blob/main/docs/Insights/%E4%B8%9A%E7%95%8C%E6%9C%80%E4%BD%B3%E5%AE%9E%E8%B7%B5/05-structured-output.md"},{"path":"业界最佳实践/06-llm-可观测性与评测.md","slug":"业界最佳实践-06-llm-可观测性与评测","title":"06 · LLM 可观测性与评测","summary":"三层都要有，缺一不可。只有 unit → 主观质量塌了看不见；只有 judge → 客观的东西（比如字段是否存在）靠 judge 不经济。","html":"\u003ch1>06 · LLM 可观测性与评测\u003c/h1>\n\u003cblockquote>\n\u003cp>\u003cstrong>来源\u003c/strong>：\u003ca href=\"https://www.digitalapplied.com/blog/agent-observability-2026-evals-traces-cost-guide\">Digital Applied — Agent Observability 2026\u003c/a> / \u003ca href=\"https://www.braintrust.dev/articles/langsmith-alternatives-2026\">Braintrust — LangSmith alternatives 2026\u003c/a> / \u003ca href=\"https://opentelemetry.io/docs/specs/semconv/gen-ai/\">OpenTelemetry — GenAI semantic conventions\u003c/a>\n\u003cstrong>抓取日期\u003c/strong>：2026-04-24\u003c/p>\n\u003c/blockquote>\n\u003ch2>三层 Eval（这是基本盘）\u003c/h2>\n\u003cblockquote>\n\u003cp>可靠的 agent 需要三层 eval：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Unit eval\u003c/strong>：对离散步骤打单点分（&quot;这个 prompt 从这个输入得出的 JSON 对不对&quot;）\u003c/li>\n\u003cli>\u003cstrong>LLM-as-judge 回归套件\u003c/strong>：对主观质量（文风 / 连贯 / 是否捕到关键洞察）打分\u003c/li>\n\u003cli>\u003cstrong>生产 trace 采样\u003c/strong>：线上真实调用采样回看，抓 drift\u003c/li>\n\u003c/ol>\n\u003c/blockquote>\n\u003cp>三层都要有，缺一不可。只有 unit → 主观质量塌了看不见；只有 judge → 客观的东西（比如字段是否存在）靠 judge 不经济。\u003c/p>\n\u003ch2>为什么对 DeepInsight 至关重要\u003c/h2>\n\u003cp>DeepInsight 的产出\u003cstrong>没有唯一正确答案\u003c/strong>。传统单测给不出&quot;这份报告好不好&quot;。必须：\u003c/p>\n\u003cul>\n\u003cli>逐字段比对（unit：schema 合法性 / citation 存在 / confidence 合理）\u003c/li>\n\u003cli>LLM-judge（回归：同一输入产出的报告质量是否不如上一版）\u003c/li>\n\u003cli>线上采样（drift：真实用户输入和 golden 分布差多远）\u003c/li>\n\u003c/ul>\n\u003cp>Z-6 守护人手上的&quot;citation 准确率门禁&quot;就是 unit 层的一例；但\u003cstrong>还需要加 judge 和采样\u003c/strong>。\u003c/p>\n\u003ch2>工具选型（不站队）\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>需求\u003c/th>\n\u003cth>推荐\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开源自托管、MIT、Docker 可起\u003c/td>\n\u003ctd>\u003cstrong>Langfuse\u003c/strong>（LLMOps 开源基线）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LangChain 深度集成\u003c/td>\n\u003ctd>LangSmith\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>严肃 eval 科学 + CI 质量门\u003c/td>\n\u003ctd>Braintrust\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>先别接工具，手搓\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>evals/\u003c/code> + 一堆 JSON + GitHub Actions\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>MVP 建议\u003c/strong>：\u003cstrong>先手搓 \u003ccode>evals/\u003c/code> 目录\u003c/strong>（见下），产品起量后再接 Langfuse 或 Braintrust。\u003cstrong>不要\u003c/strong>一上来接三家。\u003c/p>\n\u003ch2>OpenTelemetry GenAI 语义约定\u003c/h2>\n\u003cblockquote>\n\u003cp>用 OTel 的 GenAI semantic conventions 打 trace，保持 vendor 无关，未来换 observability 平台零成本\u003c/p>\n\u003c/blockquote>\n\u003cp>关键属性（span 必打）：\u003c/p>\n\u003cpre>\u003ccode>gen_ai.system          = &quot;anthropic&quot;\ngen_ai.request.model   = &quot;claude-opus-4-7&quot;\ngen_ai.usage.input_tokens\ngen_ai.usage.output_tokens\ngen_ai.usage.cache_read_input_tokens     # ← 命中率\ngen_ai.usage.cache_creation_input_tokens # ← 写入\ngen_ai.request.temperature\n\u003c/code>\u003c/pre>\n\u003cp>业务属性（我们自加）：\u003c/p>\n\u003cpre>\u003ccode>deepinsight.user_id\ndeepinsight.feature           = &quot;pdf_summary&quot; / &quot;multi_source_synth&quot;\ndeepinsight.prompt_version    = &quot;v3&quot;\ndeepinsight.document_hash\n\u003c/code>\u003c/pre>\n\u003cp>→ Z-5 守护人的 dashboard 就是在这些 tag 上做聚合。\u003c/p>\n\u003ch2>最容易出事的三类问题\u003c/h2>\n\u003cblockquote>\n\u003cp>生产事故大多来自：\u003cstrong>工具调用失败 / 上下文截断 / agent runaway loop\u003c/strong>，而\u003cstrong>不是\u003c/strong>模型本身答错。标准 APM 看不到这些，\u003cstrong>必须用 agent-aware instrumentation\u003c/strong>。\u003c/p>\n\u003c/blockquote>\n\u003cp>对 DeepInsight 直接对应：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>失败模式\u003c/th>\n\u003cth>检测方式\u003c/th>\n\u003cth>兜底\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Claude tool_call 返回异常\u003c/td>\n\u003ctd>span.status=error + gen_ai.response.finish_reasons != &quot;end_turn&quot;\u003c/td>\n\u003ctd>重试 + 用户可见降级文案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1M context 被截（超 1M）\u003c/td>\n\u003ctd>上传前预估 token，超阈值拒绝 / 触发 map-reduce\u003c/td>\n\u003ctd>预检失败前置提示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>agent loop 不收敛（subagent 调自己）\u003c/td>\n\u003ctd>统计 turn 数，&gt; N 熔断\u003c/td>\n\u003ctd>熔断后返回部分结果\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>这三项\u003cstrong>都\u003c/strong>放进 \u003ccode>spec/TEMPLATE.md\u003c/code> § 5.2 reliability checklist。\u003c/p>\n\u003ch2>落地路径（循序渐进）\u003c/h2>\n\u003ch3>阶段 1：MVP（现在 - 6 周）\u003c/h3>\n\u003cp>\u003cstrong>手搓 eval\u003c/strong>：\u003c/p>\n\u003cpre>\u003ccode>evals/\n├── golden/\n│   ├── pdf-summary/\n│   │   ├── 001-arxiv-transformers.pdf\n│   │   ├── 001-expected.json          # 人工标注的预期报告骨架\n│   │   └── 001-judge-prompt.md        # LLM-judge 打分 prompt\n│   └── ...\n├── runners/\n│   ├── run-unit.ts                    # 跑 schema + citation grounding\n│   └── run-judge.ts                   # 跑 LLM-as-judge\n└── reports/\n    └── 2026-04-24-eval.md\n\u003c/code>\u003c/pre>\n\u003cp>CI：PR 改 \u003ccode>web/lib/llm/**\u003c/code> 或 \u003ccode>prompts/**\u003c/code> → 自动跑 eval 子集 → 低于阈值阻塞合并。\u003c/p>\n\u003cp>OTel：用 \u003ccode>@opentelemetry/api\u003c/code> 打 span，先输出到控制台 / 日志文件即可，\u003cstrong>不急着接 Jaeger / Grafana\u003c/strong>。\u003c/p>\n\u003ch3>阶段 2：产品 beta（6 - 12 周）\u003c/h3>\n\u003cp>接 \u003cstrong>Langfuse\u003c/strong>（开源、MIT、自托管）：\u003c/p>\n\u003cul>\n\u003cli>所有 span 转发 Langfuse\u003c/li>\n\u003cli>开 LLM-judge 自动评分\u003c/li>\n\u003cli>建 &quot;最近 7 天 citation 准确率&quot; dashboard\u003c/li>\n\u003c/ul>\n\u003ch3>阶段 3：规模化（12 周后）\u003c/h3>\n\u003cp>看那时需要：\u003c/p>\n\u003cul>\n\u003cli>如果 eval 科学需求重 → \u003cstrong>Braintrust\u003c/strong>\u003c/li>\n\u003cli>如果 OTel 生态已成熟 → 保持自托管 + Grafana\u003c/li>\n\u003cli>生产采样率 5–10%，接到 eval 回放\u003c/li>\n\u003c/ul>\n\u003ch2>行动建议\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Z-6 守护人：现在就建 \u003ccode>evals/\u003c/code> 目录骨架 + 首批 5 条 golden\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Z-5 守护人：封装一个 \u003ccode>withGenAiSpan(fn)\u003c/code> helper，所有 Anthropic 调用走它（统一打 OTel attr）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> spec 模板 § 5.2 加三条失败模式检查（工具调用失败 / 上下文截断 / loop）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 不要在 MVP 接 LangSmith / Langfuse / Braintrust 中的任何一家（\u003cstrong>过早优化\u003c/strong>）\u003c/li>\n\u003c/ul>\n\u003ch2>参考\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://www.digitalapplied.com/blog/agent-observability-2026-evals-traces-cost-guide\">Digital Applied — Agent Observability 2026: Evals, Traces, Cost Guide\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://www.firecrawl.dev/blog/best-llm-observability-tools\">Firecrawl — Best LLM Observability Tools in 2026\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://www.braintrust.dev/articles/langsmith-alternatives-2026\">Braintrust — LangSmith alternatives (2026)\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://langfuse.com/\">Langfuse\u003c/a>（开源 LLM observability）\u003c/li>\n\u003cli>\u003ca href=\"https://opentelemetry.io/docs/specs/semconv/gen-ai/\">OpenTelemetry — Semantic conventions for generative AI\u003c/a>\u003c/li>\n\u003c/ul>\n","order":6,"updatedAt":"2026-04-25T04:37:31.171Z","githubUrl":"https://github.com/Boris-hbx/DeepInsight/blob/main/docs/Insights/%E4%B8%9A%E7%95%8C%E6%9C%80%E4%BD%B3%E5%AE%9E%E8%B7%B5/06-llm-%E5%8F%AF%E8%A7%82%E6%B5%8B%E6%80%A7%E4%B8%8E%E8%AF%84%E6%B5%8B.md"}]},{"key":"项目对标","label":"项目对标","readme":null,"docs":[{"path":"对标分析-OpenClaw-AI-Daily.md","slug":"对标分析-openclaw-ai-daily","title":"对标分析：OpenClaw AI Daily","summary":"不是同类产品，但工程范式上有明显交集：都是\"多源异构输入 → LLM 多阶段处理 → 结构化输出\"。","html":"\u003ch1>对标分析：OpenClaw AI Daily\u003c/h1>\n\u003cul>\n\u003cli>\u003cstrong>来源\u003c/strong>：\u003ca href=\"https://gitcode.com/ninjaer/AI-Daily-report\">https://gitcode.com/ninjaer/AI-Daily-report\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>抓取日期\u003c/strong>：2026-04-24\u003c/li>\n\u003cli>\u003cstrong>一句话\u003c/strong>：Node.js + SQLite 的 \u003cstrong>AI 行业新闻日报自动化系统\u003c/strong>，RSS / 博客 / Brave 搜索 / Twitter 四通道采集 → LLM 去重合并 → 中英双语日报输出\u003c/li>\n\u003c/ul>\n\u003ch2>它在做什么\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>OpenClaw AI Daily\u003c/th>\n\u003cth>DeepInsight\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>输入\u003c/td>\n\u003ctd>多通道 \u003cstrong>持续拉取\u003c/strong>（RSS/blog/search/twitter）\u003c/td>\n\u003ctd>用户 \u003cstrong>按需上传\u003c/strong>（PDF/论文链接/博客链接）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LLM 用途\u003c/td>\n\u003ctd>跨源去重、多源合并、分类、摘要、翻译\u003c/td>\n\u003ctd>解析、结构化、多模态洞察报告生成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>输出\u003c/td>\n\u003ctd>Markdown + JSON + HTML + REST API（含中英）\u003c/td>\n\u003ctd>多模态结构化报告（Web 优先，未来移动）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>技术栈\u003c/td>\n\u003ctd>Node.js + Express + SQLite\u003c/td>\n\u003ctd>Next.js App Router + Anthropic SDK\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>范式\u003c/td>\n\u003ctd>配置驱动定时批处理\u003c/td>\n\u003ctd>交互式 on-demand\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>不是同类产品，但\u003cstrong>工程范式上有明显交集\u003c/strong>：都是&quot;多源异构输入 → LLM 多阶段处理 → 结构化输出&quot;。\u003c/p>\n\u003ch2>值得借鉴的 7 点\u003c/h2>\n\u003ch3>1. YAML 驱动的&quot;信源配置&quot; → 映射到我们的&quot;输入模板&quot;\u003c/h3>\n\u003cp>OpenClaw 把 RSS / blog / search keywords / twitter targets 都抽到 \u003ccode>config/*.yaml\u003c/code>，\u003cstrong>非开发者也能扩\u003c/strong>。\n→ DeepInsight 可参考：把&quot;洞察模板&quot;（研究综述 / 竞品扫读 / 会议纪要）抽成 YAML，让非研发同事加新模板不必改代码。\u003cstrong>候选 spec\u003c/strong>：\u003ccode>spec/阿宝/insight-templates\u003c/code>。\u003c/p>\n\u003ch3>2. 三层表结构：raw → items → reports\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>raw_items\u003c/code>：原始爬取数据\u003c/li>\n\u003cli>\u003ccode>items\u003c/code>：LLM 处理后的条目（标题/摘要 ~150 字/相关度/时间戳/来源数组）\u003c/li>\n\u003cli>\u003ccode>reports\u003c/code>：最终聚合产物\n→ DeepInsight 未来加持久化时直接抄这个三层：\u003ccode>raw_input\u003c/code>（上传原件） / \u003ccode>parsed_chunks\u003c/code>（解析 + 分块后的中间态） / \u003ccode>insight_report\u003c/code>（终稿）。中间态独立存，方便回溯 &amp; 重跑。\u003c/li>\n\u003c/ul>\n\u003ch3>3. RSS-first，LLM-fallback 的成本优化\u003c/h3>\n\u003cp>RSS 能直接拿到结构化数据，就\u003cstrong>不调 LLM\u003c/strong>；只有 blog 全文提取才回落到 LLM。\n→ DeepInsight 应采纳：PDF 若自带完整 TOC/书签、arxiv 抽 abstract 页、GitHub README 这类结构清晰的输入，\u003cstrong>跳过 LLM 解析步骤\u003c/strong>直接走 deterministic 抽取。在 spec 的「成本 checklist」里明确要求作者说明&quot;为什么必须走 LLM&quot;。\u003c/p>\n\u003ch3>4. 多源归并 + 来源保留：\u003ccode>📰 多源报道\u003c/code> + 二级来源链接\u003c/h3>\n\u003cp>跨源识别同一事件、合并后\u003cstrong>保留所有来源\u003c/strong>作为脚注。\n→ DeepInsight 的报告如果未来支持&quot;多篇论文综述同一课题&quot;，这套做法直接可用。Citations API 已在章程 § 4.1 提到，但**「合并后如何保留来源」是它不解决的事**，需要我们自己在报告模板里预留&quot;多源归属&quot;槽位。\u003c/p>\n\u003ch3>5. 多阶段 LLM pipeline\u003c/h3>\n\u003cp>collection → dedup → merge → categorize → summarize → translate，每一步是\u003cstrong>独立的 prompt + 独立的评估点\u003c/strong>。\n→ 和 Anthropic 多 agent 范式同构（见 \u003ccode>业界最佳实践/02-多-agent-协作模式.md\u003c/code>）。DeepInsight 的 PDF→报告 pipeline 应显式划分：parse → extract claims → structure → synthesize → render。每步单独 eval，不要一个巨无霸 prompt。\u003c/p>\n\u003ch3>6. 三件套输出：Markdown + HTML + REST API\u003c/h3>\n\u003cp>内容和呈现分离。同一份 \u003ccode>items/reports\u003c/code> 喂给不同前端。\n→ DeepInsight 报告也要这样设计：\u003cstrong>报告数据模型 ≠ 呈现\u003c/strong>。未来卡片视图 / PDF 导出 / 移动端都从同一个 schema 渲染。早期就把 \u003ccode>report\u003c/code> 的 JSON schema 定清楚，别让 UI 把 schema 拉歪。\u003c/p>\n\u003ch3>7. 中英双语\u003c/h3>\n\u003cp>对中文团队做中英双版输出的参考范例。\n→ DeepInsight 虽然 MVP 是中文优先，但\u003cstrong>数据模型可以先预留 locale 字段\u003c/strong>，避免未来国际化时动刀。成本很低。\u003c/p>\n\u003ch2>不适用 / 可跳过的\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>定时批处理架构\u003c/strong>：DeepInsight 是交互式，不需要调度器\u003c/li>\n\u003cli>\u003cstrong>Express + SQLite\u003c/strong>：我们已定 Next.js + 未来可能 Supabase/Postgres，不改栈\u003c/li>\n\u003cli>\u003cstrong>RSS / Twitter 爬取\u003c/strong>：输入类型不同\u003c/li>\n\u003cli>\u003cstrong>Apify 依赖\u003c/strong>：外部抓取服务，和我们场景无关\u003c/li>\n\u003c/ul>\n\u003ch2>行动项（建议）\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 在 \u003ccode>docs/specs/\u003c/code> 开 \u003ccode>spec/xxx/insight-templates\u003c/code> 讨论 YAML 化输入模板（借鉴 1）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 在 Z-4 数据 pipeline 守护人的 ADR 中明确 raw/parsed/report 三层（借鉴 2、5）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 在 spec 模板的「成本 checklist」加一条：&quot;LLM 是必须的吗？有没有结构化输入可走 deterministic 路径？&quot;（借鉴 3）\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 在报告数据 schema 里预留 \u003ccode>sources: Source[]\u003c/code> + \u003ccode>locale\u003c/code> 字段（借鉴 4、7）\u003c/li>\n\u003c/ul>\n\u003cp>——以上 4 条动作预计半天量，拆成 4 个 P2 task 排期。\u003c/p>\n","order":9007199254740991,"updatedAt":"2026-04-25T04:37:31.171Z","githubUrl":"https://github.com/Boris-hbx/DeepInsight/blob/main/docs/Insights/%E5%AF%B9%E6%A0%87%E5%88%86%E6%9E%90-OpenClaw-AI-Daily.md"}]}],"totalDocs":7},"explorations":{"placeholder":false,"entries":[{"handle":"阿宝-test1","hasReadme":true,"title":"Agent Harness 的解剖 — 模型外面那层\"壳\"到底做什么","summary":"把 Claude Code / Cursor / Aider / Codex CLI 这类编码 agent 的运行时拆成 5 个组件，对比、归纳反模式、给 DeepInsight 自己写 harness 时的启示","tags":["insight-report","harness","agent-runtime","mock-demo"],"screenshotSrc":null,"screenshotPublic":null,"hasIndexHtml":true,"demoUrl":"explorations/阿宝-test1/index.html","githubUrl":"https://github.com/Boris-hbx/DeepInsight/blob/main/explorations/%E9%98%BF%E5%AE%9D-test1"}],"phase":"2026-04-25 ~ 2026-05-08（探索期）"},"sliceWall":{"placeholder":true,"message":"等待首批 spec 提交（docs/specs/NNN-*.md）。本面板将自动按负责人分列，显示每人切片的 spec → build → test → demo 状态。"},"agentMetrics":{"placeholder":true,"message":"等待首批带 [human] / [pair] / [agent] trailer 的 commit。本面板将展示 agent 协作参与度的时间序列与比例。"},"adrIndex":{"placeholder":false,"adrs":[{"id":"ADR-0000","title":"采纳 ADR（Architecture Decision Records）","file":"0000-record-architecture-decisions.md","status":"Accepted","statusKind":"accepted","date":"2026-04-23","deciders":"DeepInsight 团队","supersedes":"","supersededBy":"","summary":"DeepInsight 是 8 人协作项目，前期会在数周内集中产生大量架构 / 技术 / 流程决策。若依赖\"口述传统\"会导致：","githubUrl":"https://github.com/Boris-hbx/DeepInsight/blob/main/docs/architecture/adr/0000-record-architecture-decisions.md"},{"id":"ADR-0001","title":"8 人代码仓治理框架","file":"0001-multi-co
